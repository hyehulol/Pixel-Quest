let audioContext = null;

function initAudio(){
    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(
    frequency,
    duration=.08,
    type="square",
    volume=.04
){
    if(!audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.value = volume;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.stop(
        audioContext.currentTime + duration
    );
}

        e.code === "KeyW"

        }

    }

    if(
        e.code === "KeyE" &&

    }

    keys[e.code] = true;

/* =========================
   CONFETTI
========================= */

function createConfetti(amount=120){

    for(let i=0;i<amount;i++){

        confetti.push({

            x:canvas.width/2,
            y:250,

            velocityX:(Math.random()-.5)*14,
            velocityY:-Math.random()*13-5,

            gravity:.25+Math.random()*.15,

            size:4+Math.random()*7,

            rotation:Math.random()*Math.PI*2,

            rotationSpeed:(Math.random()-.5)*.3,

            life:180+Math.random()*80,

            color:[
                "#ff3333",
                "#ffd700",
                "#33ccff",
                "#66ff66",
                "#ff66cc",
                "#fff",
                "#ff8c00",
                "#9b59ff"
            ][Math.floor(Math.random()*8)]
        });
    }
}

function updateConfetti(){

    for(
        let i=confetti.length-1;
        i>=0;
        i--
    ){

        const p = confetti[i];

        p.x += p.velocityX;
        p.y += p.velocityY;

        p.velocityY += p.gravity;
        p.velocityX *= .995;

        p.rotation += p.rotationSpeed;

        p.life--;

        if(
            p.life <= 0 ||
            p.y > canvas.height+50
        ){
            confetti.splice(i,1);
        }
    }
}


/* =========================
   NYCKELSPARKLES
========================= */

function createKeySparkles(x,y){

    for(let i=0;i<10;i++){

        confetti.push({

            x:x-cameraX,
            y:y,

            velocityX:(Math.random()-.5)*3,
            velocityY:(Math.random()-.5)*3,

            gravity:.03,

            size:2+Math.random()*3,

            rotation:0,
            rotationSpeed:0,

            life:35+Math.random()*20,

            color:
                Math.random() > .35
                ? "#ffd700"
                : "#fff6a0"
        });
    }
}


function drawConfetti(){

    for(const p of confetti){

        ctx.save();

        ctx.translate(p.x,p.y);
        ctx.rotate(p.rotation);

        ctx.fillStyle = p.color;

        ctx.fillRect(
            -p.size/2,
            -p.size/2,
            p.size,
            p.size*.6
        );

        ctx.restore();
    }
}

function loadLevel(index){

    currentLevel = index;

    const level = levels[index];

    player.x = level.spawn.x;
    player.y = level.spawn.y;

    player.velocityY = 0;

    player.jumpsLeft = 1;

    levelCoins = level.coins.map(c => ({
        ...c,
        collected:false,
        animation:Math.random()*Math.PI*2
    }));

    levelEnemies = level.enemies.map(e => ({
        ...e,
        startX:e.x,
        direction:1,
        alive:true
    }));

    boss = level.boss
        ? {
            ...level.boss,
            health:level.boss.maxHealth,
            direction:-1
        }
        : null;


    if(level.secretBlock){

        level.secretBlock.activated = false;

        level.secretKey.visible = false;
        level.secretKey.collected = false;
        level.secretKey.velocityY = 0;

        level.secretDoor.opened = false;

        level.secretRoom.active = false;
        level.secretRoom.chestOpened = false;
        level.secretRoom.medalCollected = false;
    }

    secretMedalCollected = false;
    secretChestOpened = false;

    keyPickupTimer = 0;

    cameraX = 0;

    levelElement.textContent = currentLevel + 1;

    hideMessage();

/* =========================
   HELPERS
========================= */

function rectsOverlap(a,b){

    return (
        a.x < b.x+b.width &&
        a.x+a.width > b.x &&
        a.y < b.y+b.height &&
        a.y+a.height > b.y
    );
}

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );
}


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(){

    if(secretRoomActive){

        updateSecretRoomPlayer();

        return;
    }


    if(
        !gameRunning ||
        levelCompleteTimer > 0
    ){
        return;
    }


    const level = levels[currentLevel];

    const previousY = player.y;
    const previousBottom = previousY + player.height;


    if(player.grounded){

        player.coyoteTimer = 8;
        player.jumpsLeft = 1;

    }else{

        player.coyoteTimer--;
    }


    if(jumpPressed){

        player.jumpBufferTimer = 8;

        jumpPressed = false;

    }else{

        player.jumpBufferTimer--;
    }


    const left =
        keys.KeyA ||
        keys.ArrowLeft;

    const right =
        keys.KeyD ||
        keys.ArrowRight;


    if(left && !right){

        player.velocityX =
            Math.max(
                -player.maxSpeed,
                player.velocityX-player.acceleration
            );

        player.direction = -1;

    }else if(right && !left){

        player.velocityX =
            Math.min(
                player.maxSpeed,
                player.velocityX+player.acceleration
            );

        player.direction = 1;

    }else{

        player.velocityX = 0;
    }


    if(
        player.jumpBufferTimer > 0 &&
        (
            player.grounded ||
            player.coyoteTimer > 0
        )
    ){

        player.velocityY =
            -player.jumpPower;

        player.grounded = false;

        player.coyoteTimer = 0;
        player.jumpBufferTimer = 0;

        playSound(
            500,
            .12,
            "square",
            .05
        );
    }


    player.x += player.velocityX;

    player.velocityY += player.gravity;


    const jumpHeld =
        keys.Space ||
        keys.ArrowUp ||
        keys.KeyW;


    if(
        !jumpHeld &&
        player.velocityY < -5
    ){

        player.velocityY += .35;
    }


    player.y += player.velocityY;

    player.grounded = false;


    for(const p of level.platforms){

        const rightEdge =
            player.x + player.width;

        const playerBottom =
            player.y + player.height;

        const platformRight =
            p.x + p.w;

        const falling =
            player.velocityY >= 0;

        const horizontal =
            rightEdge > p.x &&
            player.x < platformRight;

        const crossingTop =
            previousBottom <= p.y &&
            playerBottom >= p.y;


        if(
            falling &&
            horizontal &&
            crossingTop
        ){

            player.y =
                p.y-player.height;

            player.velocityY = 0;

            player.grounded = true;

            player.jumpsLeft = 1;
        }


        const hittingBottom =
            player.velocityY < 0 &&
            previousY >= p.y+p.h &&
            player.y <= p.y+p.h;


        if(
            hittingBottom &&
            horizontal
        ){

            player.y =
                p.y+p.h;

            player.velocityY = 0;
        }
    }


    player.x = clamp(
        player.x,
        0,
        level.width-player.width
    );


    if(
        player.y >
        canvas.height+80
    ){

        loseLife();

        return;
    }


    for(const coin of levelCoins){

        if(coin.collected) continue;

        const box = {
            x:coin.x-12,
            y:coin.y-12,
            width:24,
            height:24
        };

        if(rectsOverlap(player,box)){

            coin.collected = true;

            coins++;
            score += 100;

            playSound(
                850,
                .08,
                "square",
                .04
            );
        }
    }


    for(const enemy of levelEnemies){

        if(!enemy.alive) continue;

        enemy.x +=
            enemy.speed *
            enemy.direction;


        if(
            Math.abs(
                enemy.x-enemy.startX
            ) > 90
        ){

            enemy.direction *= -1;
        }


        const box = {
            x:enemy.x,
            y:enemy.y,
            width:enemy.w,
            height:enemy.h
        };


        if(rectsOverlap(player,box)){

            const stomp =
                player.velocityY > 0 &&
                player.y+
                player.height-
                enemy.y < 20;


            if(stomp){

                enemy.alive = false;

                player.velocityY = -9;

                score += 250;

                playSound(
                    220,
                    .12,
                    "square",
                    .05
                );

            }else{

                hurtPlayer();
            }
        }
    }


    if(
        boss &&
        boss.health > 0
    ){

        boss.x +=
            boss.speed *
            boss.direction;


        if(
            boss.x < 4300 ||
            boss.x > 4750
        ){

            boss.direction *= -1;
        }


        if(rectsOverlap(player,boss)){

            const stomp =
                player.velocityY > 0 &&
                player.y+
                player.height-
                boss.y < 25;


            if(stomp){

                boss.health--;

                player.velocityY = -11;

                score += 500;

                playSound(
                    180,
                    .2,
                    "sawtooth",
                    .07
                );


                if(boss.health <= 0){

                    score += 2000;

                    createConfetti(80);

                    playSound(
                        100,
                        .5,
                        "sawtooth",
                        .08
                    );
                }

            }else{

                hurtPlayer();
            }
        }
    }


    if(currentLevel === 1){

        updateLevel2Secret(
            level,
            previousY
        );
    }


    const goal = level.goal;

    const goalBox = {
        x:goal.x,
        y:goal.y,
        width:40,
        height:80
    };


    if(
        rectsOverlap(
            player,
            goalBox
        ) &&
        (
            !boss ||
            boss.health <= 0
        )
    ){

        completeLevel();
    }


    if(
        Math.abs(player.velocityX) > .1 &&
        player.grounded
    ){

        player.walkAnimation += .2;

    }else{

        player.walkAnimation = 0;
    }


    if(player.invincible > 0){

        player.invincible--;
    }
}


/* =========================
   LEVEL 2 SECRET
========================= */

function updateLevel2Secret(
    level,
    previousY
){

    const block =
        level.secretBlock;

    const key =
        level.secretKey;

    const door =
        level.secretDoor;


    const horizontal =
        player.x+player.width >
        block.x &&
        player.x <
        block.x+block.width;


    const underside =
        player.velocityY < 0 &&
        previousY >=
        block.y+block.height &&
        player.y <=
        block.y+block.height;


    if(
        !block.activated &&
        horizontal &&
        underside
    ){

        block.activated = true;

        key.visible = true;

        key.x =
            block.x+21;

        key.y =
            block.y-28;

        key.velocityY = -3;

        score += 300;

        playSound(
            700,
            .12,
            "square",
            .05
        );

        createKeySparkles(
            key.x,
            key.y
        );
    }


    /*
        NYCKEL FALLER
    */

    if(
        key.visible &&
        !key.collected
    ){

        if(key.y < 420){

            key.velocityY += .25;

            key.y +=
                key.velocityY;
        }


        const keyBox = {
            x:key.x-12,
            y:key.y-14,
            width:42,
            height:48
        };


        if(
            rectsOverlap(
                player,
                keyBox
            )
        ){

            key.collected = true;

            score += 500;

            keyPickupTimer = 150;

            createKeySparkles(
                key.x,
                key.y
            );

            playSound(
                1000,
                .15,
                "square",
                .05
            );

            playSound(
                1300,
                .12,
                "sine",
                .04
            );
        }
    }


    /*
        HEMLIGA DÖRREN
    */

    const nearDoor =
        rectsOverlap(
            player,
            {
                x:door.x-35,
                y:door.y-10,
                width:door.width+70,
                height:door.height+20
            }
        );


    if(
        !door.opened &&
        key.collected &&
        nearDoor
    ){

        if(interactPressed){

            door.opened = true;

            interactPressed = false;

            playSound(
                650,
                .25,
                "square",
                .06
            );
        }
    }


    else if(
        door.opened &&
        nearDoor &&
        interactPressed
    ){

        interactPressed = false;

        enterSecretRoom();

        return;
    }
}


/* =========================
   SECRET ROOM PLAYER
========================= */

function updateSecretRoomPlayer(){

    if(!secretRoomActive){
        return;
    }


    const left =
        keys.KeyA ||
        keys.ArrowLeft;

    const right =
        keys.KeyD ||
        keys.ArrowRight;


    if(left && !right){

        player.x -= 4;

        player.direction = -1;

    }else if(right && !left){

        player.x += 4;

        player.direction = 1;
    }


    player.x = clamp(
        player.x,
        110,
        850
    );


    player.y = 350;


    const level =
        levels[currentLevel];


    if(interactPressed){

        interactPressed = false;


        if(player.x < 220){

            exitSecretRoom();

            return;
        }


        if(
            !level.secretRoom.chestOpened &&
            player.x > 385 &&
            player.x < 590
        ){

            openSecretChest();

            return;
        }
    }
}

/* =========================
   LAVA
========================= */

function drawLava(){

    const level =
        levels[currentLevel];

    const lavaTop = 470;


    const ground =
        level.platforms
        .filter(
            p =>
                p.y === lavaTop &&
                p.h >= 50
        )
        .sort(
            (a,b)=>a.x-b.x
        );


    let end = 0;


    for(const p of ground){

        if(p.x > end){

            drawLavaHole(
                end,
                p.x
            );
        }

        end =
            p.x+p.w;
    }


    if(level.width > end){

        drawLavaHole(
            end,
            level.width
        );
    }
}


function drawLavaHole(
    worldStart,
    worldEnd
){

    const s =
        worldStart-cameraX;

    const e =
        worldEnd-cameraX;


    if(
        e < 0 ||
        s > canvas.width
    ){

        return;
    }


    const vs =
        Math.max(0,s);

    const ve =
        Math.min(
            canvas.width,
            e
        );

    const w =
        ve-vs;


    const gradient =
        ctx.createLinearGradient(
            0,
            470,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#ff6500"
    );

    gradient.addColorStop(
        .2,
        "#e52d00"
    );

    gradient.addColorStop(
        .65,
        "#850b00"
    );

    gradient.addColorStop(
        1,
        "#220000"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        vs,
        470,
        w,
        canvas.height-470
    );


    const glow =
        ctx.createLinearGradient(
            0,
            450,
            0,
            485
        );


    glow.addColorStop(
        0,
        "rgba(255,60,0,0)"
    );

    glow.addColorStop(
        .5,
        "rgba(255,100,0,.8)"
    );

    glow.addColorStop(
        1,
        "rgba(255,30,0,0)"
    );


    ctx.fillStyle =
        glow;

    ctx.fillRect(
        vs,
        450,
        w,
        40
    );


    const time =
        Date.now()*.003;


    ctx.beginPath();

    ctx.moveTo(
        vs,
        470
    );


    for(
        let x=vs-20;
        x<=ve+20;
        x+=15
    ){

        const wave =
            Math.sin(
                x*.035+time
            )*4
            +
            Math.sin(
                x*.015-time*1.4
            )*3;


        ctx.lineTo(
            x,
            470+wave
        );
    }


    ctx.lineTo(
        ve,
        500
    );

    ctx.lineTo(
        vs,
        500
    );

    ctx.closePath();


    ctx.fillStyle =
        "#ff4800";

    ctx.fill();


    for(
        let x=vs;
        x<ve;
        x+=45
    ){

        const wave =
            Math.sin(
                x*.035+time
            )*4;


        ctx.fillStyle =
            "#ffb000";


        ctx.beginPath();

        ctx.ellipse(
            x+10,
            472+wave,
            12,
            3,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* =========================

========================= */

function drawSecretObjects(){

    if(currentLevel !== 1){

    }


    const level =
        levels[currentLevel];

    const key =
        level.secretKey;

    const door =
        level.secretDoor;

        key.visible &&

        );

        ctx.stroke();

        */

            "#ffd700";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            7,
            0,
            Math.PI*2
        );

        ctx.stroke();

        );

            3,
            6,
            10
        );

        ctx.fillRect(
            36,
            3,
            6,
            10
        );

        */

            "#fffbd0";

        ctx.fillRect(
            9,
            -7,
            5,
            4
        );


        /*
            GNISTOR
        */

        ctx.shadowBlur = 0;

        ctx.fillStyle =
            "#fff6a0";


        const sparkleSize =
            3+
            Math.sin(
                Date.now()*.012
            )*1;


        const sparklePositions = [
            [-23,-13],
            [23,-17],
            [-25,15],
            [28,14]
        ];


        for(const pos of sparklePositions){

            ctx.beginPath();

            ctx.arc(
                pos[0],
                pos[1],
                sparkleSize,
                0,
                Math.PI*2
            );

            ctx.fill();
        }


        ctx.restore();


        /*

        */

        ctx.textAlign =

        ctx.font =

        ctx.shadowColor =
            "#000";

        ctx.shadowBlur = 5;

        ctx.fillStyle =
            "#ffd700";

        ctx.fillText(
            "🔑",
            x,
            baseY-30+float
        );

        ctx.restore();
    }


    /*
        DÖRR
    */

    const dx =
        door.x-cameraX;


    if(door.opened){

        ctx.fillStyle =
            "#251508";

    }else{

        ctx.fillStyle =
            "#111";
    }


    ctx.fillRect(
        dx,
        door.y,
        door.width,
        door.height
    );


    ctx.strokeStyle =
        "#8a6a3a";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        dx,
        door.y,
        door.width,
        door.height
    );


    ctx.fillStyle =
        "#ffd700";


    ctx.beginPath();

    ctx.arc(
        dx+42,
        door.y+42,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.textAlign =
        "center";

    ctx.font =
        "bold 13px Arial";


    if(!door.opened){

        ctx.fillStyle =
            "#ffcc00";

        ctx.fillText(
            "🔒",
            dx+27,
            door.y-10
        );

    }else if(
        level.secretKey.collected
    ){

        ctx.fillStyle =
            "#ffd700";

        ctx.fillText(
            "E",
            dx+27,
            door.y-10
        );
    }
}


/* =========================
   KEY PICKUP MESSAGE
========================= */

function drawKeyPickupMessage(){

    if(keyPickupTimer <= 0){
        return;
    }


    const progress =
        150-keyPickupTimer;


    const fadeIn =
        Math.min(
            1,
            progress/15
        );


    const fadeOut =
        Math.min(
            1,
            keyPickupTimer/25
        );


    const alpha =
        Math.min(
            fadeIn,
            fadeOut
        );


    const scale =
        1+
        Math.sin(
            progress*.15
        )*.04;


    ctx.save();

    ctx.globalAlpha =
        alpha;

    ctx.translate(
        canvas.width/2,
        105
    );

    ctx.scale(
        scale,
        scale
    );


    /*
        BAKGRUNDSPLATTA
    */

    ctx.fillStyle =
        "rgba(0,0,0,.65)";

    ctx.beginPath();

    ctx.roundRect(
        -145,
        -35,
        290,
        65,
        12
    );

    ctx.fill();


    /*
        GLOW
    */

    ctx.shadowColor =
        "#ffd700";

    ctx.shadowBlur = 25;


    ctx.textAlign =
        "center";

    ctx.font =
        "bold 32px Arial";

    ctx.fillStyle =
        "#ffd700";


    ctx.fillText(
        "🔑 NYCKEL!",
        0,
        5
    );


    ctx.shadowBlur = 0;


    ctx.font =
        "bold 16px Arial";

    ctx.fillStyle =
        "#fff";

    ctx.fillText(
        "+500 poäng",
        0,
        27
    );


    ctx.restore();
}


/* =========================
   PLAYER DRAW
========================= */

function drawPlayer(){

    if(
        player.invincible > 0 &&
        Math.floor(
            player.invincible/5
        )%2===0
    ){

        return;
    }


    const x =
        player.x-cameraX;

    const y =
        player.y;


    const bob =
        player.grounded
        ? Math.sin(
            player.walkAnimation
        )*2
        : 0;


    ctx.save();

    ctx.translate(
        x,
        y+bob
    );


    ctx.fillStyle =
        "#e53935";

    ctx.fillRect(
        5,
        15,
        24,
        28
    );


    ctx.fillStyle =
        "#f2b27a";

    ctx.fillRect(
        7,
        0,
        20,
        20
    );


    ctx.fillStyle =
        "#4a2415";

    ctx.fillRect(
        6,
        0,
        22,
        7
    );


    ctx.fillStyle =
        "#e53935";

    ctx.fillRect(
        4,
        -4,
        25,
        7
    );


    ctx.fillStyle =
        "#111";


    if(player.direction === 1){

        ctx.fillRect(
            22,
            8,
            3,
            3
        );

    }else{

        ctx.fillRect(
            9,
            8,
            3,
            3
        );
    }


    ctx.fillStyle =
        "#f2b27a";

    ctx.fillRect(
        0,
        18,
        7,
        17
    );

    ctx.fillRect(
        27,
        18,
        7,
        17
    );


    ctx.fillStyle =
        "#2455a4";

    ctx.fillRect(
        7,
        40,
        9,
        8
    );

    ctx.fillRect(
        18,
        40,
        9,
        8
    );


    ctx.restore();
}


/* =========================
   SECRET ROOM
========================= */

function enterSecretRoom(){

    if(secretRoomActive){
        return;
    }


    secretRoomActive = true;

    gameRunning = false;


    levels[
        currentLevel
    ].secretRoom.active = true;


    player.x = 220;
    player.y = 350;

    player.velocityX = 0;
    player.velocityY = 0;


    cameraX = 0;


    playSound(
        500,
        .2,
        "square",
        .05
    );
}


function exitSecretRoom(){

    secretRoomActive = false;

    gameRunning = true;


    levels[
        currentLevel
    ].secretRoom.active = false;


    const door =
        levels[
            currentLevel
        ].secretDoor;


    player.x =
        door.x+
        door.width+
        15;

    player.y =
        390;


    player.velocityX = 0;
    player.velocityY = 0;


    cameraX =
        clamp(
            player.x-
            canvas.width*.4,
            0,
            levels[
                currentLevel
            ].width-
            canvas.width
        );


    playSound(
        350,
        .15,
        "square",
        .05
    );
}


/* =========================
   CHEST
========================= */

function openSecretChest(){

    const level =
        levels[currentLevel];


    if(
        level.secretRoom.chestOpened
    ){

        return;
    }


    level.secretRoom.chestOpened = true;

    secretChestOpened = true;


    score += 2000;


    createConfetti(120);


    playSound(
        900,
        .15,
        "square",
        .06
    );


    setTimeout(()=>{

        level.secretRoom.medalCollected = true;

        secretMedalCollected = true;

        score += 5000;

        createConfetti(180);


        playSound(
            1200,
            .25,
            "sine",
            .07
        );

    },800);
}


/* =========================
   SECRET ROOM DRAW
========================= */

function drawSecretRoom(){

    const level =
        levels[currentLevel];


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#080812"
    );

    gradient.addColorStop(
        1,
        "#25102d"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#30203a";

    ctx.fillRect(
        80,
        80,
        840,
        400
    );


    ctx.fillStyle =
        "#17131b";

    ctx.fillRect(
        80,
        420,
        840,
        60
    );

    ctx.fillRect(
        80,
        80,
        840,
        35
    );


    ctx.fillStyle =
        "#5b3970";

    ctx.fillRect(
        130,
        150,
        12,
        180
    );

    ctx.fillRect(
        850,
        150,
        12,
        180
    );


    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "#ffd700";

    ctx.font =
        "bold 32px Arial";


    ctx.fillText(
        "HEMLIGA RUMMET",
        500,
        155
    );


    ctx.font =
        "18px Arial";

    ctx.fillStyle =
        "#aaa";


    ctx.fillText(
        "Du hittade den gömda skatten...",
        500,
        185
    );


    const chestX = 430;
    const chestY = 330;


    ctx.fillStyle =
        "rgba(0,0,0,.4)";

    ctx.fillRect(
        chestX+5,
        chestY+55,
        140,
        15
    );


    ctx.fillStyle =
        "#8b4a20";

    ctx.fillRect(
        chestX,
        chestY,
        140,
        60
    );


    if(
        !level.secretRoom.chestOpened
    ){

        ctx.fillStyle =
            "#a8662b";

        ctx.fillRect(
            chestX,
            chestY-20,
            140,
            25
        );


        ctx.fillStyle =
            "#d39b35";

        ctx.fillRect(
            chestX+8,
            chestY+5,
            8,
            50
        );

        ctx.fillRect(
            chestX+124,
            chestY+5,
            8,
            50
        );


        ctx.fillStyle =
            "#ffd700";

        ctx.fillRect(
            chestX+62,
            chestY+12,
            16,
            20
        );

    }else{

        ctx.fillStyle =
            "#a8662b";

        ctx.fillRect(
            chestX,
            chestY-55,
            140,
            25
        );


        ctx.shadowColor =
            "#ffd700";

        ctx.shadowBlur = 25;


        ctx.fillStyle =
            "#ffd700";


        ctx.beginPath();

        ctx.arc(
            chestX+70,
            chestY-5,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        ctx.beginPath();

        ctx.arc(
            chestX+70,
            chestY-5,
            20,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle =
            "#fff2a8";

        ctx.lineWidth = 4;

        ctx.stroke();


        ctx.fillStyle =
            "#8a5a00";

        ctx.font =
            "bold 18px Arial";


        ctx.fillText(
            "★",
            chestX+70,
            chestY+2
        );
    }


    ctx.fillStyle =
        "#fff";

    ctx.font =
        "16px Arial";


    if(
        !level.secretRoom.chestOpened
    ){

        ctx.fillText(
            "Gå fram till kistan och tryck E",
            500,
            520
        );

    }else if(
        !level.secretRoom.medalCollected
    ){

        ctx.fillText(
            "🥇 Guldmedaljen är din!",
            500,
            520
        );

    }else{

        ctx.fillText(
            "🥇 Guldmedalj erhållen! +5000 poäng",
            500,
            520
        );
    }


    ctx.fillStyle =
        "#555";

    ctx.fillRect(
        120,
        365,
        70,
        55
    );


    ctx.fillStyle =
        "#ddd";

    ctx.font =
        "14px Arial";


    ctx.fillText(
        "UT",
        155,
        397
    );


    if(player.x < 230){

        ctx.fillStyle =
            "#ffd700";

        ctx.font =
            "bold 14px Arial";


        ctx.fillText(
            "E = Gå ut",
            190,
            345
        );
    }


    drawSecretRoomPlayer();
}


/* =========================
   SECRET ROOM PLAYER
========================= */

function drawSecretRoomPlayer(){

    const x =
        player.x;

    const y =
        player.y;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    ctx.fillStyle =
        "#e53935";

    ctx.fillRect(
        5,
        15,
        24,
        28
    );


    ctx.fillStyle =
        "#f2b27a";

    ctx.fillRect(
        7,
        0,
        20,
        20
    );


    ctx.fillStyle =
        "#4a2415";

    ctx.fillRect(
        6,
        0,
        22,
        7
    );


    ctx.fillStyle =
        "#e53935";

    ctx.fillRect(
        4,
        -4,
        25,
        7
    );


    ctx.fillStyle =
        "#111";


    if(player.direction === 1){

        ctx.fillRect(
            22,
            8,
            3,
            3
        );

    }else{

        ctx.fillRect(
            9,
            8,
            3,
            3
        );
    }


    ctx.fillStyle =
        "#f2b27a";

    ctx.fillRect(
        0,
        18,
        7,
        17
    );

    ctx.fillRect(
        27,
        18,
        7,
        17
    );


    ctx.fillStyle =
        "#2455a4";

    ctx.fillRect(
        7,
        40,
        9,
        8
    );

    ctx.fillRect(
        18,
        40,
        9,
        8
    );


    ctx.restore();
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    if(secretRoomActive){
        return;
    }


    const target =
        player.x-
        canvas.width*.4;


    cameraX +=
        (
            target-cameraX
        )*.1;


    cameraX =
        clamp(
            cameraX,
            0,
            levels[
                currentLevel
            ].width-
            canvas.width
        );
}


/* =========================
   HUD
========================= */

function updateHUD(){

    coinsElement.textContent =
        coins;

    livesElement.textContent =
        lives;

    scoreElement.textContent =
        score;


    if(currentLevel === 1){

        const key =
            levels[currentLevel].secretKey;


        if(key.collected){

            keyStatusElement.textContent =
                "JA";

            keyStatusElement.style.color =
                "#ffd700";

        }else{

            keyStatusElement.textContent =
                "NEJ";

            keyStatusElement.style.color =
                "#aaa";
        }

    }else{

        keyStatusElement.textContent =
            "—";

        keyStatusElement.style.color =
            "#aaa";
    }
}


/* =========================
   COMPLETE LEVEL
========================= */

function completeLevel(){

    if(levelTransition > 0){
        return;
    }


    levelTransition = 100;

    levelCompleteTimer = 110;

    player.velocityX = 0;
    player.velocityY = 0;


    score += 1000;


    createConfetti(
        currentLevel === levels.length-1
        ? 220
        : 140
    );


    playSound(
        700,
        .15,
        "square",
        .06
    );


    setTimeout(()=>{

        if(
            currentLevel <
            levels.length-1
        ){

            levelCompleteTimer = 0;

            loadLevel(
                currentLevel+1
            );

        }else{

            levelCompleteTimer = 0;

            winGame();
        }


        levelTransition = 0;

    },2300);
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    gameRunning = false;

    messageTitle.textContent =
        "GAME OVER";

    messageText.textContent =
        "Lavan tog dig! Poäng: "+
        score;

    message.style.display =
        "flex";
}


/* =========================
   WIN
========================= */

function winGame(){

    gameRunning = false;

    createConfetti(300);


    messageTitle.textContent =
        "DU KLARADE DET! 🎉";


    messageText.textContent =
        "Alla banor är klara! Poäng: "+
        score;


    message.style.display =
        "flex";
}


/* =========================
   MESSAGE
========================= */

function hideMessage(){

    message.style.display =
        "none";
}


/* =========================
   RESTART
========================= */

function restartGame(){

    coins = 0;
    lives = 3;
    score = 0;

    gameRunning = true;

    levelTransition = 0;
    levelCompleteTimer = 0;

    keyPickupTimer = 0;

    secretRoomActive = false;
    secretMedalCollected = false;
    secretChestOpened = false;

    confetti.length = 0;

    updateHUD();

    loadLevel(0);
}


restartButton.addEventListener(
    "click",
    ()=>{
        initAudio();
        restartGame();
    }
);


/* =========================
   DRAW
========================= */

function draw(){

    /*
        HEMLIGT RUM
    */

    if(secretRoomActive){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        drawSecretRoom();

        drawConfetti();

        return;
    }


    /*
        VANLIG BANA
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    drawLava();

    drawPlatforms();

    drawCoins();

    drawEnemies();

    drawBoss();

    drawSecretObjects();

    drawGoal();

    drawPlayer();

    drawConfetti();


    /*
        NYCKELUPPTAGNING
    */

    drawKeyPickupMessage();


    /*
        LEVEL COMPLETE TEXT
    */

    if(levelCompleteTimer > 0){

        const alpha =
            Math.min(
                1,
                (
                    110-
                    levelCompleteTimer
                )/20
            );


        ctx.save();

        ctx.globalAlpha =
            alpha;

        ctx.textAlign =
            "center";


        ctx.font =
            "bold 46px Arial";

        ctx.fillStyle =
            "#fff";

        ctx.shadowColor =
            "#000";

        ctx.shadowBlur = 8;


        ctx.fillText(
            currentLevel === levels.length-1
            ? "DU KLARADE DET!"
            : "BANA KLAR!",
            canvas.width/2,
            150
        );


        ctx.font =
            "bold 22px Arial";

        ctx.fillStyle =
            "#ffd700";


        ctx.fillText(
            currentLevel === levels.length-1
            ? "🎉 FANTASTISKT! 🎉"
            : "Nästa bana kommer...",
            canvas.width/2,
            190
        );


        ctx.restore();
    }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    updatePlayer();

    updateCamera();

    updateConfetti();


    /*
        TIMER FÖR
        NYCKELMEDDELANDET
    */

    if(keyPickupTimer > 0){

        keyPickupTimer--;
    }


    updateHUD();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   START
========================= */

loadLevel(0);

updateHUD();

gameLoop();

</script>
