#message {

    }

        }
    }

========================================================= */

let audioContext = null;

function sound(type) {
    try {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.connect(gain);
        gain.connect(audioContext.destination);

        let frequency = 300;
        let duration = 0.08;

        if (type === "coin") {
            frequency = 850;
            duration = 0.07;
        }

        if (type === "jump") {
            frequency = 420;
            duration = 0.09;
        }

        if (type === "hit") {
            frequency = 120;
            duration = 0.15;
        }

        if (type === "boss") {
            frequency = 80;
            duration = 0.25;
        }

        if (type === "win") {
            frequency = 700;
            duration = 0.3;
        }

        osc.frequency.value = frequency;
        osc.type = "square";

        gain.gain.setValueAtTime(0.04, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        osc.start();
        osc.stop(audioContext.currentTime + duration);
    } catch (err) {}
}

/* =========================================================
   TIMER
========================================================= */

function formatTime(ms) {
    ms = Math.max(0, ms);

    const minutes = Math.floor(ms / 60000);
    const seconds = Math.floor((ms % 60000) / 1000);
    const centiseconds = Math.floor((ms % 1000) / 10);

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0") +
        "." +
        String(centiseconds).padStart(2, "0")
    );
}

function getCurrentLevelTime() {
    if (levelStartTime === 0) return 0;
    return performance.now() - levelStartTime;
}

function getTotalTime() {
    if (totalStartTime === 0) return 0;
    return performance.now() - totalStartTime;
}

function updateTimers() {
    if (!gameRunning || gamePaused || gameFinished) return;

    timerDisplay.textContent = formatTime(getCurrentLevelTime());
    totalTimerDisplay.textContent = formatTime(getTotalTime());
}


/* =========================================================
   HIGHSCORE
========================================================= */

const HIGHSCORE_KEY = "pixelQuestHighscores";

function getHighscores() {
    try {
        const saved = localStorage.getItem(HIGHSCORE_KEY);

        if (!saved) return [];

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) return [];

        return parsed;
    } catch (err) {
        return [];
    }
}

function saveHighscores(list) {
    try {
        localStorage.setItem(HIGHSCORE_KEY, JSON.stringify(list));
    } catch (err) {}
}

function addHighscore(name, time, points, deathCount, times) {
    const highscores = getHighscores();

    highscores.push({
        name: name || "PLAYER",
        time: time,
        score: points,
        deaths: deathCount,
        levelTimes: times,
        date: new Date().toLocaleDateString("sv-SE")
    });

    highscores.sort((a, b) => {
        if (a.time !== b.time) {
            return a.time - b.time;
        }

        return b.score - a.score;
    });

    saveHighscores(highscores.slice(0, 10));
}

function renderHighscores() {
    const highscores = getHighscores();

    let html = "";

    if (highscores.length === 0) {
        html += `
            <p style="text-align:center;color:#94a3b8;">
                Ingen highscore ännu.
            </p>
        `;
    } else {
        html += `
            <table class="highscoreTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Namn</th>
                        <th>Tid</th>
                        <th>Poäng</th>
                        <th>💀</th>
                        <th>Datum</th>
                    </tr>
                </thead>
                <tbody>
        `;

        highscores.forEach((entry, index) => {
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHtml(entry.name)}</td>
                    <td>${formatTime(entry.time)}</td>
                    <td>${entry.score}</td>
                    <td>${entry.deaths}</td>
                    <td>${escapeHtml(entry.date)}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;
    }

    html += `
        <div class="bestTimes">
            <h3>Bästa tid per bana</h3>
            <div class="bestTimesGrid">
    `;

    for (let i = 0; i < 10; i++) {
        const best = getBestLevelTime(i);

        html += `
            <div class="bestTimeRow">
                <span>Bana ${i + 1}</span>
                <span>${best ? formatTime(best) : "—"}</span>
            </div>
        `;
    }

    html += `
            </div>
            <p class="smallText">
                Tiderna sparas lokalt i den här webbläsaren.
            </p>
        </div>
    `;

    highscoreContent.innerHTML = html;
}

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getBestLevelTime(levelIndex) {
    const highscores = getHighscores();

    let best = null;

    for (const scoreEntry of highscores) {
        if (!scoreEntry.levelTimes) continue;

        const time = scoreEntry.levelTimes[levelIndex];

        if (typeof time !== "number") continue;

        if (best === null || time < best) {
            best = time;
        }
    }

    return best;
}

/* =========================================================
   LEVEL LOADING
========================================================= */

let level = null;
let enemies = [];
let levelCoins = [];
let boss = null;

function loadLevel(index) {

    currentLevel = index;
    level = levels[index];

    levelMovingPlatforms = (level.movingPlatforms || []).map((p, i) => ({
        ...p,
        baseX: p.x,
        baseY: p.y,
        x: p.x,
        y: p.y,
        dx: 0,
        dy: 0,
        id: i
    }));

    levelCoins = (level.coins || []).map(c => ({
        ...c,
        collected: false
    }));

    enemies = (level.enemies || []).map((e, i) => ({
        ...e,

        startX: e.x,
        startY: e.y,

        baseY: e.y,

        direction: 1,

        alive: true,

        hp: e.type === "tank" ? 2 : 1,

        time: Math.random() * 100,

        velocityY: 0,

        id: i
    }));

    boss = level.boss
        ? {
            ...level.boss,
            direction: -1,
            hitFlash: 0,
            attackTimer: level.boss.attackCooldown || 120,
            velocityY: 0,
            alive: true
        }
        : null;

    bossProjectiles = [];

    player.x = 100;
    player.y = 300;

    player.velocityX = 0;
    player.velocityY = 0;

    player.grounded = false;
    player.invincible = 0;
    player.coyoteTimer = 0;
    player.jumpBufferTimer = 0;
    player.jumpsLeft = 1;
    player.supportPlatform = null;

    cameraX = 0;

    levelStartTime = performance.now();

    levelTransition = false;
    levelCompleteTimer = 0;

    if (index !== 1) {
        keyStatus.textContent = "—";
    } else {
        keyStatus.textContent = "NEJ";
    }

    if (level.secretKey) {
        level.secretKey.visible = false;
        level.secretKey.collected = false;
        level.secretKey.velocityY = 0;
        level.secretBlock.activated = false;
        level.secretDoor.opened = false;
        level.secretRoom.active = false;
        level.secretRoom.chestOpened = false;
        level.secretRoom.medalCollected = false;
    }

    updateHUD();
}


/* =========================================================
   KOLLISION
========================================================= */

function rectsOverlap(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function getAllPlatforms() {
    return [
        ...(level.platforms || []),
        ...levelMovingPlatforms
    ];
}


/* =========================================================
   MOVING PLATFORMS
========================================================= */

function updateMovingPlatforms() {

    for (const p of levelMovingPlatforms) {

        const oldX = p.x;
        const oldY = p.y;

        const t = performance.now() * 0.001 * p.speed + p.phase;

        if (p.axis === "y") {
            p.x = p.baseX;
            p.y = p.baseY + Math.sin(t) * p.distance;
        } else {
            p.x = p.baseX + Math.sin(t) * p.distance;
            p.y = p.baseY;
        }

        p.dx = p.x - oldX;
        p.dy = p.y - oldY;
    }
}


/* =========================================================
   SPELARENS RÖRELSE
========================================================= */

function updatePlayer() {

    if (player.supportPlatform !== null) {

        const support = levelMovingPlatforms.find(
            p => p.id === player.supportPlatform
        );

        if (support) {
            player.x += support.dx;
            player.y += support.dy;
        }
    }

    player.supportPlatform = null;

    const left =
        keys["ArrowLeft"] ||
        keys["KeyA"];

    const right =
        keys["ArrowRight"] ||
        keys["KeyD"];

    if (left && !right) {
        player.velocityX -= player.acceleration;
        player.direction = -1;
    } else if (right && !left) {
        player.velocityX += player.acceleration;
        player.direction = 1;
    } else {
        player.velocityX *= 0.78;

        if (Math.abs(player.velocityX) < 0.1) {
            player.velocityX = 0;
        }
    }

    if (player.velocityX > player.maxSpeed) {
        player.velocityX = player.maxSpeed;
    }

    if (player.velocityX < -player.maxSpeed) {
        player.velocityX = -player.maxSpeed;
    }

    if (jumpPressed) {
        player.jumpBufferTimer = 8;
    }

    if (player.jumpBufferTimer > 0) {
        player.jumpBufferTimer--;
    }

    if (player.grounded) {
        player.coyoteTimer = 8;
        player.jumpsLeft = 1;
    } else {
        player.coyoteTimer--;
    }

    if (
        player.jumpBufferTimer > 0 &&
        (player.grounded || player.coyoteTimer > 0 || player.jumpsLeft > 0)
    ) {

        if (!player.grounded && player.coyoteTimer <= 0) {
            player.jumpsLeft--;
        }

        player.velocityY = -player.jumpPower;
        player.grounded = false;
        player.coyoteTimer = 0;
        player.jumpBufferTimer = 0;

        sound("jump");
    }

    jumpPressed = false;

    player.velocityY += player.gravity;

    if (player.velocityY > 18) {
        player.velocityY = 18;
    }

    const oldY = player.y;

    player.x += player.velocityX;
    player.y += player.velocityY;

    player.grounded = false;

    if (player.x < 0) {
        player.x = 0;
        player.velocityX = 0;
    }

    if (player.x + player.width > level.width) {
        player.x = level.width - player.width;
        player.velocityX = 0;
    }

    const platforms = getAllPlatforms();

    for (const p of platforms) {

        const fallingOnto =
            oldY + player.height <= p.y &&
            player.y + player.height >= p.y;

        const horizontalOverlap =
            player.x + player.width > p.x &&
            player.x < p.x + p.w;

        if (fallingOnto && horizontalOverlap && player.velocityY >= 0) {

            player.y = p.y - player.height;
            player.velocityY = 0;
            player.grounded = true;
            player.jumpsLeft = 1;

            if (levelMovingPlatforms.includes(p)) {
                player.supportPlatform = p.id;
            }
        }

        const hittingUnderside =
            oldY >= p.y + p.h &&
            player.y <= p.y + p.h;

        if (
            hittingUnderside &&
            horizontalOverlap &&
            player.velocityY < 0
        ) {
            player.y = p.y + p.h;
            player.velocityY = 0;

            checkSecretBlock(p);
        }
    }

    if (Math.abs(player.velocityX) > 0.2) {
        player.walkAnimation += 0.2;
    }

    if (player.invincible > 0) {
        player.invincible--;
    }

    if (player.y > canvas.height + 100) {
        loseLife();
        return;
    }

    checkCoins();
    checkSpikes();
    updateEnemies();
    updateBoss();
    updateBossProjectiles();

    checkGoal();
    updateSecretRoom();
}


/* =========================================================
   SECRET BLOCK
========================================================= */

function checkSecretBlock(platform) {

    if (!level.secretBlock) return;

    const block = level.secretBlock;

    if (
        platform === block ||
        (
            player.x + player.width > block.x &&
            player.x < block.x + block.width &&
            player.y <= block.y + block.height &&
            player.y + player.height >= block.y
        )
    ) {
        if (!block.activated) {
            block.activated = true;

            level.secretKey.visible = true;
            level.secretKey.velocityY = 0;

            sound("coin");
        }
    }
}


/* =========================================================
   COINS
========================================================= */

function checkCoins() {

    for (const coin of levelCoins) {

        if (coin.collected) continue;

        const coinRect = {
            x: coin.x - 10,
            y: coin.y - 10,
            width: 20,
            height: 20
        };

        if (rectsOverlap(player, coinRect)) {

            coin.collected = true;

            coins++;
            score += 100;

            sound("coin");
        }
    }
}


/* =========================================================
   SPIKES
========================================================= */

function checkSpikes() {

    for (const spike of level.spikes || []) {

        const rect = {
            x: spike.x,
            y: spike.y,
            width: spike.w,
            height: spike.h
        };

        if (rectsOverlap(player, rect)) {
            hurtPlayer();
            return;
        }
    }
}


/* =========================================================
   FIENDER
========================================================= */

function updateEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive) continue;

        if (enemy.type === "flyer") {

            enemy.time += 0.04;

            enemy.y =
                enemy.baseY +
                Math.sin(enemy.time) * 35;

            enemy.x += enemy.speed * enemy.direction;

            if (enemy.x > enemy.startX + 120) {
                enemy.direction = -1;
            }

            if (enemy.x < enemy.startX - 120) {
                enemy.direction = 1;
            }

        } else {

            enemy.x += enemy.speed * enemy.direction;

            if (enemy.x > enemy.startX + 150) {
                enemy.direction = -1;
            }

            if (enemy.x < enemy.startX - 150) {
                enemy.direction = 1;
            }

            if (enemy.type === "jumper") {

                enemy.velocityY += 0.45;
                enemy.y += enemy.velocityY;

                if (enemy.y >= enemy.baseY) {
                    enemy.y = enemy.baseY;
                    enemy.velocityY = -10;
                }
            }
        }

        const enemyRect = {
            x: enemy.x,
            y: enemy.y,
            width: enemy.w || (enemy.type === "tank" ? 48 : 38),
            height: enemy.h || (enemy.type === "tank" ? 50 : 40)
        };

        if (rectsOverlap(player, enemyRect)) {

            const playerBottom =
                player.y + player.height;

            const enemyTop =
                enemy.y;

            const stomp =
                player.velocityY > 0 &&
                playerBottom - enemyTop < 22;

            if (stomp) {

                enemy.hp--;

                player.velocityY = -10;

                score += 250;

                sound("hit");

                if (enemy.hp <= 0) {
                    enemy.alive = false;
                    score += 250;
                }

            } else {
                hurtPlayer();
            }
        }
    }
}


/* =========================================================
   BOSS
========================================================= */

function updateBoss() {

    if (!boss || !boss.alive) return;

    if (boss.hitFlash > 0) {
        boss.hitFlash--;
    }

    boss.x += boss.speed * boss.direction;

    if (boss.x < boss.minX) {
        boss.x = boss.minX;
        boss.direction = 1;
    }

    if (boss.x > boss.maxX) {
        boss.x = boss.maxX;
        boss.direction = -1;
    }

    boss.attackTimer--;

    if (boss.attackTimer <= 0) {

        spawnBossProjectile();

        boss.attackTimer =
            boss.attackCooldown || 120;
    }

    const bossRect = {
        x: boss.x,
        y: boss.y,
        width: boss.width,
        height: boss.height
    };

    if (rectsOverlap(player, bossRect)) {

        const stomp =
            player.velocityY > 0 &&
            player.y + player.height - boss.y < 30;

        if (stomp) {

            if (boss.hitFlash <= 0) {

                boss.health--;

                boss.hitFlash = 15;

                player.velocityY = -12;

                score += 500;

                sound("boss");

                if (boss.health <= 0) {

                    boss.alive = false;

                    score += 2000;

                    bossProjectiles = [];

                    createConfetti(100);

                    sound("win");
                }
            }

        } else {
            hurtPlayer();
        }
    }
}


/* =========================================================
   BOSS PROJEKTILER
========================================================= */

function spawnBossProjectile() {

    if (!boss || !boss.alive) return;

    const startX =
        boss.x + boss.width / 2;

    const startY =
        boss.y + 45;

    const targetX =
        player.x + player.width / 2;

    const targetY =
        player.y + player.height / 2;

    const dx = targetX - startX;
    const dy = targetY - startY;

    const distance =
        Math.sqrt(dx * dx + dy * dy) || 1;

    const speed =
        boss.style === "final" ? 5 : 4;

    bossProjectiles.push({
        x: startX,
        y: startY,

        vx: dx / distance * speed,
        vy: dy / distance * speed,

        radius: 9,

        life: 240
    });
}

function updateBossProjectiles() {

    for (let i = bossProjectiles.length - 1; i >= 0; i--) {

        const p = bossProjectiles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

        const projectileRect = {
            x: p.x - p.radius,
            y: p.y - p.radius,
            width: p.radius * 2,
            height: p.radius * 2
        };

        if (rectsOverlap(player, projectileRect)) {

            hurtPlayer();

            bossProjectiles.splice(i, 1);

            continue;
        }

        if (
            p.life <= 0 ||
            p.x < -500 ||
            p.x > level.width + 500 ||
            p.y < -500 ||
            p.y > canvas.height + 500
        ) {
            bossProjectiles.splice(i, 1);
        }
    }
}


/* =========================================================
   SKADA / LIV
========================================================= */

function hurtPlayer() {

    if (player.invincible > 0) return;

    lives--;
    deaths++;

    score = Math.max(0, score - 100);

    player.invincible = 100;

    player.velocityY = -9;

    sound("hit");

    if (lives <= 0) {

        gameRunning = false;

        showGameOver();

    } else {

        player.x = Math.max(
            50,
            player.x - 100
        );

        player.y = 250;

        player.velocityX = 0;
    }
}

function loseLife() {

    if (player.invincible > 0) return;

    hurtPlayer();
}


/* =========================================================
   MÅL
========================================================= */

function checkGoal() {

    if (levelTransition) return;

    const goal = level.goal;

    if (!goal) return;

    if (
        player.x + player.width > goal.x &&
        player.x < goal.x + goal.w &&
        player.y + player.height > goal.y &&
        player.y < goal.y + goal.h
    ) {

        if (boss && boss.alive) {
            return;
        }

        completeLevel();
    }
}


/* =========================================================
   KLARA BANA
========================================================= */

function completeLevel() {

    if (levelTransition) return;

    levelTransition = true;

    const levelTime =
        performance.now() - levelStartTime;

    levelTimes[currentLevel] = levelTime;

    completedLevels++;

    score += 1000;

    createConfetti(80);

    sound("win");

    if (currentLevel < levels.length - 1) {

        showLevelComplete(levelTime);

        setTimeout(() => {

            hideMessage();

            loadLevel(currentLevel + 1);

        }, 2500);

    } else {

        finishGame(levelTime);
    }
}

function showLevelComplete(levelTime) {

    message.style.display = "block";

    messageTitle.textContent =
        "🏁 BANA " + (currentLevel + 1) + " KLAR!";

    const best =
        getBestLevelTime(currentLevel);

    let bestText = "";

    if (best !== null) {

        if (levelTime < best) {
            bestText =
                "<p>🏆 Ny bästa registrerade tid!</p>";
        } else {
            bestText =
                "<p>Bästa sparade tid: " +
                formatTime(best) +

        }
    }

    messageText.innerHTML = `
        <p>
            ${escapeHtml(level.name)}
        </p>

        <p>
            Tid: <span style="color:#67e8f9">

            </span>
        </p>

        <p>
            Total tid:
            <span style="color:#fbbf24">
            ${formatTime(getTotalTime())}
            </span>
        </p>

        ${bestText}
    `;

    messageButtons.innerHTML = `
        <p class="smallText">
            Nästa bana startar automatiskt...
        </p>
    `;
}

/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    message.style.display = "none";

    highscoreScreen.style.display = "none";

    coins = 0;
    lives = 3;
    score = 0;
    deaths = 0;

    levelTimes = [];
    completedLevels = 0;

    gameRunning = true;
    gamePaused = false;
    gameFinished = false;

    totalStartTime = performance.now();

    loadLevel(0);

    updateHUD();
}


/* =========================================================
   SECRET ROOM
========================================================= */

function updateSecretRoom() {

    if (!level.secretKey) return;

    const key = level.secretKey;

    if (key.visible && !key.collected) {

        key.velocityY += 0.25;

        key.y += key.velocityY;

        if (key.y > 420) {
            key.y = 420;
            key.velocityY = 0;
        }

        const keyRect = {
            x: key.x - 8,
            y: key.y - 8,
            width: 34,
            height: 40
        };

        if (rectsOverlap(player, keyRect)) {

            key.collected = true;

            score += 500;

            keyStatus.textContent = "JA";

            createConfetti(20);

            sound("coin");
        }
    }

    const door = level.secretDoor;

    if (
        interactPressed &&
        player.x + player.width > door.x - 50 &&
        player.x < door.x + door.width + 50 &&
        player.y + player.height > door.y - 50 &&
        player.y < door.y + door.height + 50
    ) {

        if (key.collected) {

            door.opened = true;

            level.secretRoom.active = true;

            score += 500;

            sound("win");
        }
    }

    interactPressed = false;

    if (
        level.secretRoom.active &&
        !level.secretRoom.chestOpened
    ) {

        const chest = {
            x: 3650,
            y: 350,
            width: 55,
            height: 45
        };

        if (rectsOverlap(player, chest)) {

            level.secretRoom.chestOpened = true;

            score += 2000;

            createConfetti(60);

            sound("win");

            setTimeout(() => {

                if (
                    level &&
                    level.secretRoom &&
                    level.secretRoom.chestOpened &&
                    !level.secretRoom.medalCollected
                ) {

                    level.secretRoom.medalCollected = true;

                    score += 5000;

                    createConfetti(80);

                }

            }, 800);
        }
    }
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    coinsEl.textContent = coins;
    livesEl.textContent = lives;
    scoreEl.textContent = score;

    levelEl.textContent =

    if (level && level.secretKey) {

            level.secretKey.collected
                ? "JA"
                : "NEJ";
    }

    updateTimers();
}


/* =========================================================
   KAMERA
========================================================= */

function updateCamera() {

    const target =
        player.x -
        canvas.width * 0.4;

    cameraX +=
        (target - cameraX) * 0.08;

    if (cameraX < 0) {
        cameraX = 0;
    }

    const maxCamera =
        level.width - canvas.width;

    if (cameraX > maxCamera) {
        cameraX = maxCamera;
    }
}


/* =========================================================
   BAKGRUND
========================================================= */

function drawBackground() {

    const theme = level.theme;

    let top = "#7dd3fc";
    let bottom = "#bae6fd";

    if (theme === "cave") {
        top = "#111827";
        bottom = "#312e81";
    }

    if (theme === "desert") {
        top = "#fbbf24";
        bottom = "#fed7aa";
    }

    if (theme === "ice") {
        top = "#bae6fd";
        bottom = "#e0f2fe";
    }

    if (theme === "volcano") {
        top = "#3f0d0d";
        bottom = "#7f1d1d";
    }

    if (theme === "ruins") {
        top = "#334155";
        bottom = "#64748b";
    }

    if (theme === "sky") {
        top = "#38bdf8";
        bottom = "#e0f2fe";
    }

    if (theme === "swamp") {
        top = "#052e16";
        bottom = "#14532d";
    }

    if (theme === "factory") {
        top = "#111827";
        bottom = "#374151";
    }

    if (theme === "final") {
        top = "#09090b";
        bottom = "#312e81";
    }

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(0, top);
    gradient.addColorStop(1, bottom);

    ctx.fillStyle = gradient;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* måne/sol */

    ctx.save();

    const celestialX =
        800 - cameraX * 0.15;

    ctx.globalAlpha = 0.8;

    if (
        theme === "cave" ||
        theme === "volcano" ||
        theme === "final" ||
        theme === "factory"
    ) {

        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(
            celestialX,
            100,
            45,
            0,
            Math.PI * 2
        );
        ctx.fill();

    } else {

        ctx.fillStyle = "#fde68a";
        ctx.beginPath();
        ctx.arc(
            celestialX,
            100,
            50,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.restore();

    /* bakgrundsberg */

    ctx.save();

    ctx.fillStyle =
        theme === "volcano"
            ? "rgba(30,10,10,.65)"
            : theme === "final"
                ? "rgba(10,5,25,.7)"
                : "rgba(15,23,42,.25)";

    ctx.beginPath();

    ctx.moveTo(0, 430);

    for (let x = -100; x <= canvas.width + 200; x += 180) {

        const height =
            80 +
            Math.sin(
                (x + cameraX * 0.12) * 0.02
            ) * 45;

        ctx.lineTo(
            x,
            430 - height
        );
    }

    ctx.lineTo(
        canvas.width,
        canvas.height
    );

    ctx.lineTo(
        0,
        canvas.height
    );

    ctx.closePath();
    ctx.fill();

    ctx.restore();

    /* små stjärnor */

    if (
        theme === "cave" ||
        theme === "final" ||
        theme === "factory"
    ) {

        ctx.fillStyle = "rgba(255,255,255,.6)";

        for (let i = 0; i < 50; i++) {

            const x =
                (i * 173 -
                cameraX * 0.05) %
                canvas.width;

            const y =
                40 +
                (i * 71) % 220;

            ctx.fillRect(
                (x + canvas.width) % canvas.width,
                y,
                2,
                2
            );
        }
    }
}


/* =========================================================
   LAVA
========================================================= */

function drawLava() {

    const groundPlatforms =
        (level.platforms || []).filter(
            p => p.y >= 450
        );

    for (let i = 0; i < groundPlatforms.length - 1; i++) {

        const current =
            groundPlatforms[i];

        const next =
            groundPlatforms[i + 1];

        const gapStart =
            current.x + current.w;

        const gapEnd =
            next.x;

        if (gapEnd <= gapStart) continue;

        const screenX =
            gapStart - cameraX;

        const width =
            gapEnd - gapStart;

        ctx.fillStyle = "#ef4444";

        ctx.fillRect(
            screenX,
            500,
            width,
            60
        );

        ctx.fillStyle = "#f97316";

        for (
            let x = screenX;
            x < screenX + width;
            x += 24
        ) {

            const wave =
                Math.sin(
                    (x + performance.now() * 0.01)
                    * 0.08
                ) * 5;

            ctx.beginPath();

            ctx.arc(
                x,
                500 + wave,
                10,
                Math.PI,
                0
            );

            ctx.fill();
        }
    }
}


/* =========================================================
   PLATTFORMAR
========================================================= */

function drawPlatforms() {

    let groundColor = "#166534";
    let topColor = "#22c55e";

    if (level.theme === "cave") {
        groundColor = "#3730a3";
        topColor = "#6366f1";
    }

    if (level.theme === "desert") {
        groundColor = "#92400e";
        topColor = "#d97706";
    }

    if (level.theme === "ice") {
        groundColor = "#0e7490";
        topColor = "#67e8f9";
    }

    if (level.theme === "volcano") {
        groundColor = "#7f1d1d";
        topColor = "#ef4444";
    }

    if (level.theme === "ruins") {
        groundColor = "#475569";
        topColor = "#94a3b8";
    }

    if (level.theme === "sky") {
        groundColor = "#0369a1";
        topColor = "#38bdf8";
    }

    if (level.theme === "swamp") {
        groundColor = "#14532d";
        topColor = "#22c55e";
    }

    if (level.theme === "factory") {
        groundColor = "#1f2937";
        topColor = "#64748b";
    }

    if (level.theme === "final") {
        groundColor = "#312e81";
        topColor = "#7c3aed";
    }

    for (const p of level.platforms || []) {

        const x =
            p.x - cameraX;

        if (
            x + p.w < 0 ||
            x > canvas.width
        ) continue;

        ctx.fillStyle = groundColor;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );

        ctx.fillStyle = topColor;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            8
        );

        /* små detaljer */

        ctx.fillStyle = "rgba(0,0,0,.12)";

        for (
            let d = x + 10;
            d < x + p.w;
            d += 30
        ) {

            ctx.fillRect(
                d,
                p.y + 18,
                10,
                5
            );
        }
    }

    drawMovingPlatforms();
}

function drawMovingPlatforms() {

    for (const p of levelMovingPlatforms) {

        const x =
            p.x - cameraX;

        ctx.fillStyle = "#475569";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );

        ctx.fillStyle = "#fbbf24";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            5
        );

        ctx.fillStyle = "#cbd5e1";

        for (
            let i = 0;
            i < p.w;
            i += 25
        ) {

            ctx.fillRect(
                x + i + 5,
                p.y + 8,
                10,
                5
            );
        }
    }
}


/* =========================================================
   SPIKES
========================================================= */

function drawSpikes() {

    for (const s of level.spikes || []) {

        const x =
            s.x - cameraX;

        if (
            x + s.w < 0 ||
            x > canvas.width
        ) continue;

        const spikeWidth = 20;

        for (
            let sx = x;
            sx < x + s.w;
            sx += spikeWidth
        ) {

            ctx.fillStyle = "#e5e7eb";

            ctx.beginPath();

            ctx.moveTo(
                sx,
                s.y + s.h
            );

            ctx.lineTo(
                sx + spikeWidth / 2,
                s.y
            );

            ctx.lineTo(
                sx + spikeWidth,
                s.y + s.h
            );

            ctx.closePath();

            ctx.fill();

            ctx.strokeStyle = "#64748b";
            ctx.stroke();
        }
    }
}


/* =========================================================
   COINS
========================================================= */

function drawCoins() {

    for (const coin of levelCoins) {

        if (coin.collected) continue;

        const x =
            coin.x - cameraX;

        if (
            x < -30 ||
            x > canvas.width + 30
        ) continue;

        const bob =
            Math.sin(
                performance.now() * 0.006 +
                coin.x
            ) * 4;

        ctx.save();

        ctx.translate(
            x,
            coin.y + bob
        );

        ctx.fillStyle = "#facc15";

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            9,
            13,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = "#ca8a04";
        ctx.lineWidth = 2;

        ctx.stroke();

        ctx.fillStyle = "#fef08a";

        ctx.fillRect(
            -2,
            -7,
            4,
            14
        );

        ctx.restore();
    }
}


/* =========================================================
   FIENDER RITA
========================================================= */

function drawEnemies() {

    for (const e of enemies) {

        if (!e.alive) continue;

        const w =
            e.w ||
            (e.type === "tank" ? 48 : 38);

        const h =
            e.h ||
            (e.type === "tank" ? 50 : 40);

        const x =
            e.x - cameraX;

        if (
            x + w < 0 ||
            x > canvas.width
        ) continue;

        ctx.save();

        ctx.translate(
            x + w / 2,
            e.y + h / 2
        );

        if (e.type === "flyer") {

            ctx.fillStyle = "#06b6d4";

            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                18,
                14,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = "#67e8f9";

            ctx.beginPath();

            ctx.ellipse(
                -19,
                0,
                13,
                7,
                -0.3,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.beginPath();

            ctx.ellipse(
                19,
                0,
                13,
                7,
                0.3,
                0,
                Math.PI * 2
            );

            ctx.fill();

        } else if (e.type === "jumper") {

            ctx.fillStyle = "#f97316";

            ctx.fillRect(
                -17,
                -20,
                34,
                40
            );

            ctx.fillStyle = "#fff";

            ctx.fillRect(
                -10,
                -10,
                7,
                7
            );

            ctx.fillRect(
                3,
                -10,
                7,
                7
            );

        } else if (e.type === "tank") {

            ctx.fillStyle = "#475569";

            ctx.fillRect(
                -24,
                -25,
                48,
                50
            );

            ctx.fillStyle = "#94a3b8";

            ctx.fillRect(
                -19,
                -30,
                38,
                10
            );

            ctx.fillStyle = "#ef4444";

            ctx.fillRect(
                -13,
                -7,
                8,
                8
            );

            ctx.fillRect(
                5,
                -7,
                8,
                8
            );

        } else if (e.type === "fast") {

            ctx.fillStyle = "#ef4444";

            ctx.beginPath();

            ctx.moveTo(
                -20,
                20
            );

            ctx.lineTo(
                -15,
                -15
            );

            ctx.lineTo(
                20,
                0
            );

            ctx.lineTo(
                15,
                20
            );

            ctx.closePath();

            ctx.fill();

            ctx.fillStyle = "#fee2e2";

            ctx.fillRect(
                -8,
                -5,
                6,
                6
            );

            ctx.fillRect(
                5,
                -5,
                6,
                6
            );

        } else {

            ctx.fillStyle = "#8b5cf6";

            ctx.fillRect(
                -19,
                -20,
                38,
                40
            );

            ctx.fillStyle = "#fff";

            ctx.fillRect(
                -11,
                -9,
                7,
                7
            );

            ctx.fillRect(
                4,
                -9,
                7,
                7
            );
        }

        ctx.restore();
    }
}


/* =========================================================
   BOSS RITA
========================================================= */

function drawBoss() {

    if (!boss || !boss.alive) return;

    const x =
        boss.x - cameraX;

    if (
        x + boss.width < 0 ||
        x > canvas.width
    ) return;

    ctx.save();

    if (boss.hitFlash > 0) {
        ctx.globalAlpha =
            boss.hitFlash % 2 === 0
                ? 0.4
                : 1;
    }

    const centerX =
        x + boss.width / 2;

    if (boss.style === "lava") {

        ctx.fillStyle = "#991b1b";

        ctx.fillRect(
            x,
            boss.y,
            boss.width,
            boss.height
        );

        ctx.fillStyle = "#ef4444";

        ctx.beginPath();

        ctx.moveTo(
            centerX - 45,
            boss.y
        );

        ctx.lineTo(
            centerX - 25,
            boss.y - 35
        );

        ctx.lineTo(
            centerX - 5,
            boss.y
        );

        ctx.lineTo(
            centerX + 20,
            boss.y - 35
        );

        ctx.lineTo(
            centerX + 45,
            boss.y
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle = "#facc15";

        ctx.fillRect(
            centerX - 32,
            boss.y + 40,
            15,
            15
        );

        ctx.fillRect(
            centerX + 17,
            boss.y + 40,
            15,
            15
        );

    } else {

        ctx.fillStyle = "#111827";

        ctx.fillRect(
            x,
            boss.y,
            boss.width,
            boss.height
        );

        ctx.fillStyle = "#7c3aed";

        ctx.fillRect(
            x + 10,
            boss.y + 15,
            boss.width - 20,
            20
        );

        ctx.fillStyle = "#f43f5e";

        ctx.fillRect(
            centerX - 32,
            boss.y + 48,
            18,
            12
        );

        ctx.fillRect(
            centerX + 14,
            boss.y + 48,
            18,
            12
        );

        ctx.fillStyle = "#4c1d95";

        ctx.beginPath();

        ctx.moveTo(
            centerX - 55,
            boss.y
        );

        ctx.lineTo(
            centerX - 35,
            boss.y - 45
        );

        ctx.lineTo(
            centerX - 10,
            boss.y
        );

        ctx.lineTo(
            centerX + 10,
            boss.y - 45
        );

        ctx.lineTo(
            centerX + 35,
            boss.y
        );

        ctx.closePath();

        ctx.fill();
    }

    ctx.restore();

    /* HP bar */

    const barWidth = 180;
    const barHeight = 15;

    const barX =
        x + boss.width / 2 - barWidth / 2;

    const barY =
        boss.y - 35;

    ctx.fillStyle = "#111827";

    ctx.fillRect(
        barX,
        barY,
        barWidth,
        barHeight
    );

    ctx.fillStyle =
        boss.style === "lava"
            ? "#ef4444"
            : "#a855f7";

    ctx.fillRect(
        barX,
        barY,
        barWidth *
        (boss.health / boss.maxHealth),
        barHeight
    );

    ctx.strokeStyle = "#fff";

    ctx.strokeRect(
        barX,
        barY,
        barWidth,
        barHeight
    );

    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        boss.style === "lava"
            ? "LAVAKUNGEN"
            : "THE FINAL BOSS",
        centerX,
        barY - 8
    );
}


/* =========================================================
   BOSS PROJEKTILER RITA
========================================================= */

function drawBossProjectiles() {

    for (const p of bossProjectiles) {

        const x =
            p.x - cameraX;

        ctx.save();

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#f97316";

        ctx.fillStyle = "#f97316";

        ctx.beginPath();

        ctx.arc(
            x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "#fef08a";

        ctx.beginPath();

        ctx.arc(
            x - 2,
            p.y - 2,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   MÅL RITA
========================================================= */

function drawGoal() {

    const goal =
        level.goal;

    const x =
        goal.x - cameraX;

    ctx.save();

    ctx.fillStyle =
        boss && boss.alive
            ? "#64748b"
            : "#22c55e";

    ctx.fillRect(
        x,
        goal.y,
        8,
        goal.h
    );

    ctx.fillStyle =
        boss && boss.alive
            ? "#475569"
            : "#4ade80";

    ctx.beginPath();

    ctx.moveTo(
        x + 8,
        goal.y + 5
    );

    ctx.lineTo(
        x + 55,
        goal.y + 20
    );

    ctx.lineTo(
        x + 8,
        goal.y + 35
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   SECRET OBJEKT
========================================================= */

function drawSecretObjects() {

    if (!level.secretBlock) return;

    const block =
        level.secretBlock;

    const blockX =
        block.x - cameraX;

    ctx.fillStyle =
        block.activated
            ? "#fbbf24"
            : "#7c3aed";

    ctx.fillRect(
        blockX,
        block.y,
        block.width,
        block.height
    );

    ctx.fillStyle = "#fff";

    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "?",
        blockX + block.width / 2,
        block.y + 15
    );

    const key =
        level.secretKey;

    if (key.visible && !key.collected) {

        const x =
            key.x - cameraX;

        const bob =
            Math.sin(
                performance.now() * 0.006
            ) * 4;

        ctx.save();

        ctx.translate(
            x,
            key.y + bob
        );

        ctx.rotate(
            Math.sin(
                performance.now() * 0.004
            ) * 0.2
        );

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#facc15";

        ctx.fillStyle = "#facc15";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillRect(
            6,
            -3,
            25,
            6
        );

        ctx.fillRect(
            25,
            -3,
            5,
            12
        );

        ctx.fillRect(
            17,
            -3,
            5,
            9
        );

        ctx.restore();

        ctx.fillStyle = "#fef08a";

        ctx.font = "bold 14px Arial";

        ctx.fillText(
            "🔑 NYCKEL!",
            x,
            key.y - 20
        );
    }

    const door =
        level.secretDoor;

    const doorX =
        door.x - cameraX;

    ctx.fillStyle =
        door.opened
            ? "#22c55e"
            : "#7c3aed";

    ctx.fillRect(
        doorX,
        door.y,
        door.width,
        door.height
    );

    ctx.fillStyle = "#fff";

    ctx.font = "bold 11px Arial";

    ctx.fillText(
        door.opened
            ? "ÖPPEN"
            : "E",
        doorX + door.width / 2,
        door.y + 45
    );

    if (level.secretRoom.active) {

        const chestX =
            3650 - cameraX;

        ctx.fillStyle =
            level.secretRoom.chestOpened
                ? "#64748b"
                : "#a16207";

        ctx.fillRect(
            chestX,
            350,
            55,
            45
        );

        ctx.fillStyle = "#facc15";

        ctx.fillRect(
            chestX + 23,
            365,
            9,
            12
        );

        if (level.secretRoom.medalCollected) {

            ctx.fillStyle = "#facc15";

            ctx.font = "bold 16px Arial";

            ctx.fillText(
                "🏅",
                chestX + 28,
                335
            );
        }
    }
}


/* =========================================================
   SPELARE RITA
========================================================= */

function drawPlayer() {

    if (
        player.invincible > 0 &&
        Math.floor(player.invincible / 5) % 2 === 0
    ) {
        return;
    }

    const x =
        player.x - cameraX;

    ctx.save();

    ctx.translate(
        x + player.width / 2,
        player.y + player.height / 2
    );

    if (player.direction < 0) {
        ctx.scale(-1, 1);
    }

    /* kropp */

    ctx.fillStyle = "#2563eb";

    ctx.fillRect(
        -15,
        -4,
        30,
        25
    );

    /* huvud */

    ctx.fillStyle = "#fbbf24";

    ctx.fillRect(
        -13,
        -22,
        26,
        20
    );

    /* hår */

    ctx.fillStyle = "#7c2d12";

    ctx.fillRect(
        -14,
        -25,
        28,
        7
    );

    /* ögon */

    ctx.fillStyle = "#111827";

    ctx.fillRect(
        -7,
        -15,
        4,
        5
    );

    ctx.fillRect(
        4,
        -15,
        4,
        5
    );

    /* ben */

    ctx.fillStyle = "#1d4ed8";

    ctx.fillRect(
        -13,
        21,
        10,
        18
    );

    ctx.fillRect(
        3,
        21,
        10,
        18
    );

    /* skor */

    ctx.fillStyle = "#111827";

    ctx.fillRect(
        -15,
        36,
        13,
        6
    );

    ctx.fillRect(
        2,
        36,
        13,
        6
    );

    /* gånganimation */

    if (
        Math.abs(player.velocityX) > 0.3 &&
        player.grounded
    ) {

        const legOffset =
            Math.sin(player.walkAnimation) * 3;

        ctx.fillStyle = "#1d4ed8";

        ctx.fillRect(
            -13,
            21 + legOffset,
            10,
            18
        );

        ctx.fillRect(
            3,
            21 - legOffset,
            10,
            18
        );
    }

    ctx.restore();
}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(amount) {

    for (let i = 0; i < amount; i++) {

        confetti.push({
            x: Math.random() * canvas.width,
            y: -10,
            velocityX:
                (Math.random() - 0.5) * 5,
            velocityY:
                Math.random() * 4 + 2,
            size:
                Math.random() * 6 + 3,
            rotation:
                Math.random() * Math.PI,
            rotationSpeed:
                (Math.random() - 0.5) * 0.2,
            life: 180
        });
    }
}

function updateConfetti() {

    for (
        let i = confetti.length - 1;
        i >= 0;
        i--
    ) {

        const c = confetti[i];

        c.x += c.velocityX;
        c.y += c.velocityY;

        c.velocityY += 0.05;

        c.rotation += c.rotationSpeed;

        c.life--;

        if (c.life <= 0) {
            confetti.splice(i, 1);
        }
    }
}

function drawConfetti() {

    const colors = [
        "#ef4444",
        "#facc15",
        "#22c55e",
        "#3b82f6",
        "#a855f7",
        "#f97316"
    ];

    for (const c of confetti) {

        ctx.save();

        ctx.translate(
            c.x,
            c.y
        );

        ctx.rotate(
            c.rotation
        );

        ctx.fillStyle =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        ctx.fillRect(
            -c.size / 2,
            -c.size / 2,
            c.size,
            c.size
        );

        ctx.restore();
    }
}


/* =========================================================
   NIVÅTEXT
========================================================= */

function drawLevelName() {

    if (levelTransition) return;

    if (
        performance.now() - levelStartTime < 2500
    ) {

        const elapsed =
            performance.now() -
            levelStartTime;

        const alpha =
            Math.min(
                1,
                Math.max(
                    0,
                    (2500 - elapsed) / 500
                )
            );

        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.fillStyle =
            "rgba(0,0,0,.55)";

        ctx.fillRect(
            250,
            40,
            500,
            65
        );

        ctx.fillStyle = "#fff";

        ctx.textAlign = "center";

        ctx.font = "bold 25px Arial";

        ctx.fillText(
            `BANA ${currentLevel + 1}`,
            500,
            68
        );

        ctx.font = "16px Arial";

        ctx.fillText(
            level.name,
            500,
            91
        );

        ctx.restore();
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawLava();

    drawPlatforms();

    drawSpikes();

    drawCoins();

    drawSecretObjects();

    drawEnemies();

    drawBossProjectiles();

    drawBoss();

    drawGoal();

    drawPlayer();

    drawConfetti();

    drawLevelName();
}


/* =========================================================
   MAIN GAME LOOP
========================================================= */

function gameLoop() {

    if (gameRunning && !gamePaused) {

        updateMovingPlatforms();

        updatePlayer();

        updateCamera();

        updateConfetti();

        updateHUD();
    }

    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   START
========================================================= */

totalStartTime = performance.now();

loadLevel(0);

updateHUD();

gameLoop();

</script>
