.messageBox{

#highscorePanel{

.highscoreBox{

let audioContext = null;

function sound(freq=440,duration=.08,type="square"){
    try{
        if(!audioContext){
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.value = freq;

        gain.gain.setValueAtTime(.05,audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
    }catch(e){}
}

        e.preventDefault();
    }

    if(!keys[e.code]){
        if(e.code==="Space" || e.code==="ArrowUp" || e.code==="KeyW"){
            jumpPressed = true;
        }

        if(e.code==="KeyE"){
            interactPressed = true;
        }
    }

    keys[e.code] = true;

    if(e.code==="KeyR"){
        restartGame();
    }

    if(e.code==="KeyH"){
        showHighscores();
    }
});

// Startar alla timers
function startGameTimer(){
    const now = performance.now();

    gameStartTime = now;
    levelStartTime = now;

    frozenGameTime = 0;
    frozenLevelTime = 0;

    timerFrozen = false;

    levelTimes = [];
}


// Startar bara timern för aktuell bana
function startLevelTimer(){
    const now = performance.now();

    levelStartTime = now;

    frozenLevelTime = 0;

    timerFrozen = false;
}


// Fryser timer
function freezeTimers(){
    if(timerFrozen) return;

    const now = performance.now();

    frozenGameTime = now - gameStartTime;
    frozenLevelTime = now - levelStartTime;

    timerFrozen = true;
}


// Återupptar total timer efter level transition
function resumeNextLevelTimer(){
    const now = performance.now();

    gameStartTime = now - frozenGameTime;
    levelStartTime = now;

    frozenLevelTime = 0;

    timerFrozen = false;
}


function getGameTime(){
    if(timerFrozen){
        return frozenGameTime;
    }

    return performance.now() - gameStartTime;
}


function getLevelTime(){
    if(timerFrozen){
        return frozenLevelTime;
    }

    return performance.now() - levelStartTime;
}


function formatTime(ms){
    const centiseconds = Math.floor(ms / 10);

    const cs = String(centiseconds % 100).padStart(2,"0");

    const totalSeconds = Math.floor(centiseconds / 100);

    const seconds = String(totalSeconds % 60).padStart(2,"0");

    const minutes = String(Math.floor(totalSeconds / 60)).padStart(2,"0");

    return `${minutes}:${seconds}.${cs}`;
}

const HIGHSCORE_KEY = "pixelQuestHighScoresV2";

let highScores = [];

function loadHighScores(){
    try{
        highScores =
            JSON.parse(localStorage.getItem(HIGHSCORE_KEY)) || [];

        if(!Array.isArray(highScores)){
            highScores = [];
        }
    }catch(e){
        highScores = [];
    }
}


function saveHighScore(){
    let name = nameInput.value.trim();

    if(!name){
        name = "Spelare";
    }

    name = name.substring(0,16);

    highScores.push({
        name:name,
        time:pendingFinalTime,
        date:new Date().toLocaleDateString("sv-SE"),
        levelTimes:[...levelTimes]
    });

    highScores.sort((a,b)=>a.time-b.time);

    highScores = highScores.slice(0,10);

    localStorage.setItem(
        HIGHSCORE_KEY,
        JSON.stringify(highScores)
    );

    saveScoreButton.disabled = true;
    nameInput.disabled = true;

    renderHighscores();
}


function getBestLevelTimes(){
    const best = Array(levels.length).fill(null);

    highScores.forEach(run=>{
        if(!run.levelTimes) return;

        run.levelTimes.forEach((time,index)=>{
            if(time == null) return;

            if(best[index] === null || time < best[index]){
                best[index] = time;
            }
        });
    });

    return best;
}


function renderHighscores(){
    let html = "";

    html += `
        <div class="highscoreRow highscoreHeader">
            <div>#</div>
            <div>Namn</div>
            <div>Tid</div>
            <div>Datum</div>
        </div>
    `;

    if(highScores.length===0){
        html += `
            <p style="text-align:center;margin:20px 0;">
                Ingen highscore ännu.
            </p>
        `;
    }

    highScores.forEach((entry,index)=>{
        html += `
            <div class="highscoreRow">
                <div>${index+1}</div>
                <div>${escapeHtml(entry.name)}</div>
                <div>${formatTime(entry.time)}</div>
                <div>${entry.date}</div>
            </div>
        `;
    });

    const best = getBestLevelTimes();

    html += `
        <div class="bestLevels">
            <h3>🥇 Bästa tid per bana</h3>
    `;

    levels.forEach((level,index)=>{
        html += `
            <div class="bestLevelRow">
                <span>Bana ${index+1}: ${level.name}</span>
                <span>
                    ${
                        best[index] === null
                        ? "--:--.--"
                        : formatTime(best[index])
                    }
                </span>
            </div>
        `;
    });

    html += "</div>";

    highscoreList.innerHTML = html;
}


function escapeHtml(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function showHighscores(final=false){
    highscorePanel.style.display = "flex";

    if(final){

        saveScoreButton.style.display = "inline-block";
        nameInput.style.display = "block";

        saveScoreButton.disabled = false;
        nameInput.disabled = false;
        nameInput.value = "";
    }else{
        finalTimeArea.innerHTML = "";
        saveScoreButton.style.display = "none";
        nameInput.style.display = "none";
    }

    renderHighscores();
}

// ============================================================
// AKTIV LEVELDATA
// ============================================================

let platforms = [];
let coinsData = [];
let enemies = [];
let spikes = [];
let movingPlatforms = [];
let boss = null;
let goal = null;
let bossProjectiles = [];


// ============================================================
// LEVEL 2 SECRET
// ============================================================

function resetSecretRoom(){
    secretRoom.active = false;
    secretRoom.chestOpened = false;
    secretRoom.medalCollected = false;

    secretBlock.activated = false;

    secretKey.visible = false;
    secretKey.collected = false;
    secretKey.velocityY = 0;

    secretDoor.opened = false;
}


// ============================================================
// LOAD LEVEL
// ============================================================

function loadLevel(index){
    currentLevel = index;

    const data = levels[index];

    platforms = data.platforms.map(p=>({...p}));

    coinsData = data.coins.map(c=>({
        x:c[0],
        y:c[1],
        collected:false,
        radius:8
    }));

    enemies = data.enemies.map(e=>({
        x:e.x,
        y:e.y,
        width:e.type==="tank"?48:34,
        height:e.type==="flyer"?32:32,
        type:e.type,
        velocityX:e.type==="fast"?2.8:1.5,
        velocityY:0,
        direction:1,
        grounded:false,
        jumpTimer:0,
        dead:false
    }));

    spikes = data.spikes
        ? data.spikes.map(s=>({...s}))
        : [];

    movingPlatforms = data.movingPlatforms
        ? data.movingPlatforms.map(p=>({
            ...p,
            startTime:Math.random()*1000
        }))
        : [];

    boss = data.boss
        ? {
            ...data.boss,
            hp:data.boss.maxHp,
            dead:false
        }
        : null;

    bossProjectiles = [];

    goal = {...data.goal};

    player.x = 100;
    player.y = 350;
    player.velocityX = 0;
    player.velocityY = 0;
    player.grounded = false;
    player.jumpsLeft = 1;
    player.coyoteTimer = 0;
    player.jumpBufferTimer = 0;
    player.invincible = 0;

    cameraX = 0;

    if(index!==1){
        resetSecretRoom();
    }else{
        resetSecretRoom();
    }

    levelCount.textContent = index+1;

    startLevelTimer();
}


// ============================================================
// KOLLISION
// ============================================================

function rectsOverlap(a,b){
    return (
        a.x < b.x+b.width &&
        a.x+a.width > b.x &&
        a.y < b.y+b.height &&
        a.y+a.height > b.y
    );
}


function pointInRect(x,y,r){
    return (
        x>=r.x &&
        x<=r.x+r.width &&
        y>=r.y &&
        y<=r.y+r.height
    );
}


// ============================================================
// MOVING PLATFORMS
// ============================================================

function updateMovingPlatforms(){
    const now = performance.now();

    movingPlatforms.forEach(p=>{
        const oldX = p.x;
        const oldY = p.y;

        if(p.axis==="x"){
            p.x =
                p.baseX +
                Math.sin((now+p.startTime)*p.speed)*p.range;
        }else{
            p.y =
                p.baseY +
                Math.sin((now+p.startTime)*p.speed)*p.range;
        }

        p.deltaX = p.x-oldX;
        p.deltaY = p.y-oldY;
    });
}


// ============================================================
// SPELARRÖRELSE
// ============================================================

function updatePlayer(){

    if(!gameRunning) return;

    if(player.invincible>0){
        player.invincible--;
    }

    const left =
        keys["ArrowLeft"] ||
        keys["KeyA"];

    const right =
        keys["ArrowRight"] ||
        keys["KeyD"];

    if(left && !right){
        player.velocityX -= player.acceleration;
        player.direction = -1;
    }

    if(right && !left){
        player.velocityX += player.acceleration;
        player.direction = 1;
    }

    if(!left && !right){
        player.velocityX *= .75;

        if(Math.abs(player.velocityX)<.05){
            player.velocityX=0;
        }
    }

    player.velocityX = Math.max(
        -player.maxSpeed,
        Math.min(player.maxSpeed,player.velocityX)
    );


    if(player.grounded){
        player.coyoteTimer=8;
        player.jumpsLeft=1;
    }else{
        player.coyoteTimer--;
    }


    if(jumpPressed){
        player.jumpBufferTimer=8;
    }else{
        player.jumpBufferTimer--;
    }


    if(
        player.jumpBufferTimer>0 &&
        (player.grounded || player.coyoteTimer>0 || player.jumpsLeft>0)
    ){
        player.velocityY = -player.jumpPower;

        if(!player.grounded && player.coyoteTimer<=0){
            player.jumpsLeft--;
        }

        player.grounded=false;
        player.coyoteTimer=0;
        player.jumpBufferTimer=0;

        sound(520,.09,"square");
    }


    if(
        !(
            keys["Space"] ||
            keys["ArrowUp"] ||
            keys["KeyW"]
        ) &&
        player.velocityY < -5
    ){
        player.velocityY += .35;
    }


    player.velocityY += player.gravity;

    if(player.velocityY>18){
        player.velocityY=18;
    }


    const oldX = player.x;
    const oldY = player.y;

    player.x += player.velocityX;

    // Horisontell kollision
    platforms.forEach(p=>{
        if(rectsOverlap(player,p)){
            if(oldX+player.width <= p.x){
                player.x = p.x-player.width;
                player.velocityX=0;
            }else if(oldX >= p.x+p.w){
                player.x = p.x+p.w;
                player.velocityX=0;
            }
        }
    });


    movingPlatforms.forEach(p=>{
        const r = {
            x:p.x,
            y:p.y,
            width:p.w,
            height:p.h
        };

        if(rectsOverlap(player,r)){
            if(oldX+player.width<=r.x){
                player.x=r.x-player.width;
                player.velocityX=0;
            }else if(oldX>=r.x+r.width){
                player.x=r.x+r.width;
                player.velocityX=0;
            }
        }
    });


    player.y += player.velocityY;

    player.grounded=false;


    // Vertikal kollision mot vanliga plattformar
    platforms.forEach(p=>{
        if(rectsOverlap(player,p)){

            if(oldY+player.height <= p.y && player.velocityY>=0){
                player.y = p.y-player.height;
                player.velocityY=0;
                player.grounded=true;
                player.jumpsLeft=1;
            }

            else if(oldY >= p.y+p.h && player.velocityY<0){
                player.y=p.y+p.h;
                player.velocityY=0;

                checkSecretBlockHit(p);
            }
        }
    });


    // Moving platforms
    movingPlatforms.forEach(p=>{
        const r={
            x:p.x,
            y:p.y,
            width:p.w,
            height:p.h
        };

        if(rectsOverlap(player,r)){

            if(
                oldY+player.height<=r.y &&
                player.velocityY>=0
            ){
                player.y=r.y-player.height;
                player.velocityY=0;
                player.grounded=true;
                player.jumpsLeft=1;

                player.x += p.deltaX || 0;
            }
        }
    });


    // Coin pickup
    coinsData.forEach(c=>{
        if(c.collected) return;

        const dx =
            player.x+player.width/2-c.x;

        const dy =
            player.y+player.height/2-c.y;

        if(Math.sqrt(dx*dx+dy*dy)<25){
            c.collected=true;
            coins++;
            score+=100;

            sound(880,.08,"square");
        }
    });


    // Spikes
    spikes.forEach(s=>{
        if(rectsOverlap(player,{
            x:s.x,
            y:s.y,
            width:s.w,
            height:s.h
        })){
            hurtPlayer();
        }
    });


    // Enemies
    updateEnemies();


    // Boss
    updateBoss();


    // Projectiles
    updateBossProjectiles();


    // Goal
    if(goal && pointInRect(
        player.x+player.width/2,
        player.y+player.height/2,
        {
            x:goal.x,
            y:goal.y,
            width:55,
            height:80
        }
    )){
        if(!boss || boss.dead){
            completeLevel();
        }
    }


    // Secret objects
    updateSecretObjects();


    // Falling
    if(player.y > canvas.height+100){
        hurtPlayer();
    }


    player.walkAnimation +=
        Math.abs(player.velocityX)*.15;


    jumpPressed=false;
    interactPressed=false;
}


// ============================================================
// SECRET BLOCK
// ============================================================

function checkSecretBlockHit(p){
    if(currentLevel!==1) return;

    if(
        p.x===secretBlock.x ||
        (
            p.x < secretBlock.x+secretBlock.width &&
            p.x+p.w > secretBlock.x
        )
    ){
        if(
            player.y+player.height <=
            secretBlock.y+secretBlock.height+8
        ){
            if(!secretBlock.activated){
                secretBlock.activated=true;
                secretKey.visible=true;
                secretKey.velocityY=-2;

                score+=250;

                sound(700,.12,"square");
            }
        }
    }
}


function updateSecretObjects(){

    if(currentLevel!==1) return;

    if(secretKey.visible && !secretKey.collected){

        secretKey.velocityY += .2;
        secretKey.y += secretKey.velocityY;

        if(secretKey.y>390){
            secretKey.y=390;
            secretKey.velocityY=0;
        }

        if(rectsOverlap(player,{
            x:secretKey.x,
            y:secretKey.y,
            width:secretKey.width,
            height:secretKey.height
        })){
            secretKey.collected=true;
            keyPickupTimer=140;
            score+=500;

            sound(1000,.15,"square");
        }
    }


    if(
        secretKey.collected &&
        rectsOverlap(player,{
            x:secretDoor.x,
            y:secretDoor.y,
            width:secretDoor.width,
            height:secretDoor.height
        })
    ){
        if(interactPressed || keys["KeyE"]){
            secretDoor.opened=true;
            secretRoom.active=true;

            sound(600,.2,"sine");
        }
    }


    if(secretRoom.active){
        const chest={
            x:3650,
            y:370,
            width:55,
            height:45
        };

        if(
            !secretRoom.chestOpened &&
            rectsOverlap(player,chest)
        ){
            secretRoom.chestOpened=true;

            score+=2000;

            sound(900,.2,"square");

            setTimeout(()=>{
                score+=5000;
                secretRoom.medalCollected=true;

                createConfetti(80);
            },800);
        }
    }
}


// ============================================================
// FIENDER
// ============================================================

function updateEnemies(){

    enemies.forEach(enemy=>{

        if(enemy.dead) return;

        if(enemy.type==="flyer"){
            enemy.x += enemy.velocityX;

            enemy.y +=
                Math.sin(performance.now()*.004+enemy.x)*.8;

            if(enemy.x<0 || enemy.x>levels[currentLevel].width-100){
                enemy.velocityX*=-1;
            }
        }

        else{

            enemy.velocityY += .6;

            enemy.x += enemy.velocityX;

            enemy.y += enemy.velocityY;

            let grounded=false;

            platforms.forEach(p=>{
                if(
                    enemy.x+enemy.width>p.x &&
                    enemy.x<p.x+p.w &&
                    enemy.y+enemy.height>=p.y &&
                    enemy.y+enemy.height<=p.y+18 &&
                    enemy.velocityY>=0
                ){
                    enemy.y=p.y-enemy.height;
                    enemy.velocityY=0;
                    grounded=true;
                }
            });

            enemy.grounded=grounded;


            if(enemy.type==="jumper"){
                enemy.jumpTimer++;

                if(
                    enemy.grounded &&
                    enemy.jumpTimer>80
                ){
                    enemy.velocityY=-11;
                    enemy.jumpTimer=0;
                }
            }


            if(enemy.x<0 || enemy.x>levels[currentLevel].width-50){
                enemy.velocityX*=-1;
            }
        }


        // Tank är långsammare
        if(enemy.type==="tank"){
            enemy.velocityX =
                Math.sign(enemy.velocityX || 1)*.8;
        }


        // Kollision spelare/enemy
        if(rectsOverlap(player,enemy)){

            if(
                player.velocityY>2 &&
                player.y+player.height <
                enemy.y+enemy.height*.55
            ){
                enemy.dead=true;

                player.velocityY=-9;

                score+=250;

                sound(180,.1,"square");
            }else{
                hurtPlayer();
            }
        }

    });
}


// ============================================================
// BOSS
// ============================================================

function updateBoss(){

    if(!boss || boss.dead) return;

    boss.x += boss.velocityX;

    if(
        boss.x < levels[currentLevel].width-850 ||
        boss.x > levels[currentLevel].width-250
    ){
        boss.velocityX *= -1;
    }


    boss.shootTimer++;

    if(boss.shootTimer>110){
        boss.shootTimer=0;

        bossProjectiles.push({
            x:boss.x,
            y:boss.y+60,
            width:18,
            height:18,
            velocityX:
                player.x<boss.x ? -5 : 5,
            velocityY:0,
            life:300
        });

        sound(120,.15,"sawtooth");
    }


    if(rectsOverlap(player,{
        x:boss.x,
        y:boss.y,
        width:boss.width,
        height:boss.height
    })){

        if(
            player.velocityY>2 &&
            player.y+player.height <
            boss.y+boss.height*.55
        ){
            boss.hp--;

            player.velocityY=-11;

            score+=500;

            sound(250,.12,"square");

            if(boss.hp<=0){
                boss.dead=true;
                score+=2000;
                createConfetti(100);
                sound(900,.3,"square");
            }
        }else{
            hurtPlayer();
        }
    }
}


function updateBossProjectiles(){

    bossProjectiles.forEach(p=>{
        p.x += p.velocityX;
        p.y += p.velocityY;
        p.life--;

        if(rectsOverlap(player,p)){
            p.life=0;
            hurtPlayer();
        }
    });

    bossProjectiles =
        bossProjectiles.filter(p=>p.life>0);
}


// ============================================================
// SKADA
// ============================================================

function hurtPlayer(){

    if(player.invincible>0) return;

    lives--;

    sound(100,.2,"sawtooth");

    player.invincible=120;

    player.velocityY=-8;

    if(lives<=0){
        gameOver();
        return;
    }

    // Behåller tiden när man dör.
    player.x=100;
    player.y=300;
    player.velocityX=0;
    player.velocityY=0;
}


// ============================================================
// CAMERA
// ============================================================

function updateCamera(){

    const target =
        player.x-canvas.width*.4;

    cameraX +=
        (target-cameraX)*.1;

    const maxCamera =
        levels[currentLevel].width-canvas.width;

    cameraX =
        Math.max(
            0,
            Math.min(cameraX,maxCamera)
        );
}


// ============================================================
// LEVEL COMPLETE
// ============================================================

function completeLevel(){

    if(levelTransition) return;

    if(boss && !boss.dead) return;

    levelTransition=true;

    const finishedLevelTime = getLevelTime();

    levelTimes[currentLevel]=finishedLevelTime;

    freezeTimers();

    score+=1000;

    createConfetti(80);

    const nextLevel = currentLevel+1;

    if(nextLevel < levels.length){

        message.style.display="flex";

        messageBox.innerHTML=`
            <h1>🎉 BANA KLAR!</h1>
            <p>${levels[currentLevel].name}</p>
            <p>⏱️ Banans tid: <strong>${formatTime(finishedLevelTime)}</strong></p>
            <p>⌛ Total tid: ${formatTime(frozenGameTime)}</p>
            <p>Nästa bana laddas...</p>
        `;

        setTimeout(()=>{
            loadLevel(nextLevel);

            message.style.display="none";

            levelTransition=false;

            resumeNextLevelTimer();

        },2300);

    }else{
        winGame();
    }
}

// ============================================================
// CONFETTI
// ============================================================

function createConfetti(amount){

    for(let i=0;i<amount;i++){

        confetti.push({
            x:player.x+Math.random()*100-50,
            y:player.y-50,
            velocityX:(Math.random()-.5)*8,
            velocityY:Math.random()*-8-2,
            gravity:.25,
            size:Math.random()*6+3,
            rotation:Math.random()*Math.PI*2,
            life:100+Math.random()*100
        });
    }
}


function updateConfetti(){

    confetti.forEach(c=>{
        c.x+=c.velocityX;
        c.y+=c.velocityY;
        c.velocityY+=c.gravity;
        c.rotation+=.1;
        c.life--;
    });

    confetti=confetti.filter(c=>c.life>0);
}


function drawConfetti(){

    confetti.forEach(c=>{
        ctx.save();

        ctx.translate(
            c.x-cameraX,
            c.y
        );

        ctx.rotate(c.rotation);

        ctx.fillStyle =
            `hsl(${Math.random()*360},90%,60%)`;

        ctx.fillRect(
            -c.size/2,
            -c.size/2,
            c.size,
            c.size*1.8
        );

        ctx.restore();
    });
}


// ============================================================
// BAKGRUND
// ============================================================

function drawBackground(){

    const theme=levels[currentLevel].theme;

    let top="#70c8ff";
    let bottom="#d7f5ff";

    if(theme==="cave"){
        top="#17152b";
        bottom="#392c55";
    }

    if(theme==="desert"){
        top="#ff9d55";
        bottom="#ffe0a3";
    }

    if(theme==="ice"){
        top="#9ce7ff";
        bottom="#e8fbff";
    }

    if(theme==="volcano"){
        top="#260b0b";
        bottom="#9c2e12";
    }

    if(theme==="ruins"){
        top="#4c5263";
        bottom="#a7a7a7";
    }

    if(theme==="sky"){
        top="#5dafff";
        bottom="#eaf9ff";
    }

    if(theme==="swamp"){
        top="#183d37";
        bottom="#5b7950";
    }

    if(theme==="factory"){
        top="#171b29";
        bottom="#3b4050";
    }

    if(theme==="final"){
        top="#090817";
        bottom="#3c183f";
    }


    const gradient =
        ctx.createLinearGradient(
            0,0,0,canvas.height
        );

    gradient.addColorStop(0,top);
    gradient.addColorStop(1,bottom);

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    // Parallax-bakgrund
    ctx.save();

    ctx.translate(-cameraX*.15,0);

    for(let i=0;i<25;i++){

        const x=i*300;

        ctx.fillStyle=
            theme==="final"
            ? "rgba(180,80,220,.18)"
            : "rgba(255,255,255,.16)";

        ctx.beginPath();

        ctx.arc(
            x,
            100+(i%4)*35,
            25+(i%3)*12,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


// ============================================================
// LAVA
// ============================================================

function drawLava(){

    const data=levels[currentLevel];

    for(let i=0;i<data.platforms.length-1;i++){

        const a=data.platforms[i];
        const b=data.platforms[i+1];

        if(a.y===470 && b.y===470){

            const gapStart=a.x+a.w;
            const gapEnd=b.x;

            if(gapEnd>gapStart){

                const screenX=gapStart-cameraX;

                ctx.fillStyle="#ff3b16";

                ctx.fillRect(
                    screenX,
                    470,
                    gapEnd-gapStart,
                    90
                );

                ctx.fillStyle="#ffcf32";

                for(
                    let x=gapStart;
                    x<gapEnd;
                    x+=25
                ){
                    const wave =
                        Math.sin(
                            performance.now()*.006+x*.05
                        )*4;

                    ctx.fillRect(
                        x-cameraX,
                        470+wave,
                        18,
                        5
                    );
                }
            }
        }
    }
}


// ============================================================
// PLATTFORMAR
// ============================================================

function drawPlatforms(){

    const theme=levels[currentLevel].theme;

    let platformColor="#3f9c45";

    if(theme==="cave") platformColor="#6c5c8f";
    if(theme==="desert") platformColor="#bd8745";
    if(theme==="ice") platformColor="#8ed8ee";
    if(theme==="volcano") platformColor="#68241b";
    if(theme==="ruins") platformColor="#6e707c";
    if(theme==="sky") platformColor="#9bcce7";
    if(theme==="swamp") platformColor="#49663b";
    if(theme==="factory") platformColor="#59616b";
    if(theme==="final") platformColor="#52205f";


    platforms.forEach(p=>{

        ctx.fillStyle=platformColor;

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.w,
            p.h
        );

        ctx.fillStyle="rgba(255,255,255,.12)";

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.w,
            5
        );
    });


    movingPlatforms.forEach(p=>{

            p.y,
            p.w,

            p.x-cameraX,
            p.y,
            p.w,

        );

}


// ============================================================
// SPIKES
// ============================================================

function drawSpikes(){

    spikes.forEach(s=>{

        const count=Math.max(
            1,
            Math.floor(s.w/15)
        );

        for(let i=0;i<count;i++){

            const x=
                s.x-cameraX+
                i*(s.w/count);

            const w=s.w/count;

            ctx.fillStyle="#dce3e8";

            ctx.beginPath();

            ctx.moveTo(x,s.y+s.h);
            ctx.lineTo(x+w/2,s.y);
            ctx.lineTo(x+w,s.y+s.h);

            ctx.closePath();

            ctx.fill();
        }
    });
}


// ============================================================
// COINS
// ============================================================

function drawCoins(){

    coinsData.forEach(c=>{

        if(c.collected) return;

        const pulse=
            Math.sin(performance.now()*.006+c.x)*2;

        ctx.fillStyle="#ffd83d";

        ctx.beginPath();

        ctx.arc(
            c.x-cameraX,
            c.y+pulse,
            c.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#fff2a1";

        ctx.stroke();
    });
}

    );

function gameLoop(){

    updateMovingPlatforms();

    updatePlayer();

    updateCamera();

    updateConfetti();

    draw();

    requestAnimationFrame(gameLoop);
