/* =========================================================
   LJUD
========================================================= */

let audioContext = null;

function initAudio(){
    if(!audioContext){
        audioContext =
            new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(
    frequency,
    duration=.08,
    type="square",
    volume=.04
){
    if(!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.value = volume;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.stop(
        audioContext.currentTime + duration
    );
}

    initAudio();

    if(

        e.code==="ArrowUp" ||
        e.code==="KeyW"
    ){

        if(!keys[e.code]){
            jumpPressed=true;
        }

        e.preventDefault();
    }

    if(
        e.code==="KeyE" &&
        !keys[e.code]
    ){
        interactPressed=true;
    }

    keys[e.code]=true;

    if(e.code==="KeyR"){
        restartGame();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.code]=false;
});

/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(amount=120){

    for(let i=0;i<amount;i++){

        confetti.push({

            x:canvas.width/2,
            y:250,

            velocityX:(Math.random()-.5)*14,
            velocityY:-Math.random()*13-5,

            gravity:.25+Math.random()*.15,

            size:4+Math.random()*7,

            rotation:Math.random()*Math.PI*2,

            rotationSpeed:(Math.random()-.5)*.3,

            life:180+Math.random()*80,

            color:[
                "#ff3333",
                "#ffd700",
                "#33ccff",
                "#66ff66",
                "#ff66cc",
                "#fff",
                "#ff8c00",
                "#9b59ff"
            ][Math.floor(Math.random()*8)]
        });
    }
}

function updateConfetti(){

    for(
        let i=confetti.length-1;
        i>=0;
        i--
    ){

        const p=confetti[i];

        p.x+=p.velocityX;
        p.y+=p.velocityY;

        p.velocityY+=p.gravity;
        p.velocityX*=.995;

        p.rotation+=p.rotationSpeed;

        p.life--;

        if(
            p.life<=0 ||
            p.y>canvas.height+50
        ){
            confetti.splice(i,1);
        }
    }
}

function drawConfetti(){

    for(const p of confetti){

        ctx.save();

        ctx.translate(p.x,p.y);
        ctx.rotate(p.rotation);

        ctx.fillStyle=p.color;

        ctx.fillRect(
            -p.size/2,
            -p.size/2,
            p.size,
            p.size*.6
        );

        ctx.restore();
    }
}

/* =========================================================
   LOAD LEVEL
========================================================= */

function loadLevel(index){

    currentLevel=index;

    const level=levels[index];

    player.x=level.spawn.x;
    player.y=level.spawn.y;

    player.velocityX=0;
    player.velocityY=0;

    player.invincible=0;
    player.coyoteTimer=0;
    player.jumpBufferTimer=0;

    player.grounded=false;
    player.jumpsLeft=1;

    levelCoins=level.coins.map(c=>({
        ...c,
        collected:false,
        animation:Math.random()*Math.PI*2
    }));

    levelEnemies=level.enemies.map(e=>({
        ...e,
        startX:e.x,
        startY:e.y,
        direction:1,
        alive:true,
        jumpTimer:Math.random()*100,
        animation:Math.random()*Math.PI*2
    }));

    levelSpikes=(level.spikes || []).map(s=>({...s}));

    levelMovingPlatforms=
        (level.movingPlatforms || []).map(p=>({...p}));

    levelProjectiles=[];

    boss=level.boss
        ? {
            ...level.boss,
            health:level.boss.maxHealth,
            direction:-1,
            attackTimer:90,
            hitFlash:0,
            phase:0
        }
        : null;

    if(level.secretBlock){

        level.secretBlock.activated=false;

        level.secretKey.visible=false;
        level.secretKey.collected=false;
        level.secretKey.velocityY=0;

        level.secretDoor.opened=false;

        level.secretRoom.active=false;
        level.secretRoom.chestOpened=false;
        level.secretRoom.medalCollected=false;
    }

    secretRoomActive=false;

    keyPickupTimer=0;

    cameraX=0;

    levelElement.textContent=currentLevel+1;

    hideMessage();
}


/* =========================================================
   HELPERS
========================================================= */

function rectsOverlap(a,b){

    return(
        a.x < b.x+b.width &&
        a.x+a.width > b.x &&
        a.y < b.y+b.height &&
        a.y+a.height > b.y
    );
}

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );
}


/* =========================================================
   MOVING PLATFORMS
========================================================= */

function updateMovingPlatforms(){

    for(const p of levelMovingPlatforms){

        p.x+=p.speed*p.direction;

        if(p.x<=p.minX){

            p.x=p.minX;
            p.direction=1;
        }

        if(p.x>=p.maxX){

            p.x=p.maxX;
            p.direction=-1;
        }
    }
}

function drawMovingPlatforms(){

    for(const p of levelMovingPlatforms){

        const x=p.x-cameraX;

        if(x+p.w<0 || x>canvas.width){
            continue;
        }

        ctx.fillStyle="#454545";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );

        ctx.fillStyle="#ffd54a";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            5
        );

        ctx.fillStyle="#222";

        for(let i=10;i<p.w;i+=25){

            ctx.fillRect(
                x+i,
                p.y+8,
                12,
                5
            );
        }
    }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(){

    if(secretRoomActive){

        updateSecretRoomPlayer();
        return;
    }

    if(
        !gameRunning ||
        levelCompleteTimer>0
    ){
        return;
    }

    const level=levels[currentLevel];

    const previousY=player.y;
    const previousBottom=
        previousY+player.height;

    if(player.grounded){

        player.coyoteTimer=8;
        player.jumpsLeft=1;

    }else{

        player.coyoteTimer--;
    }

    if(jumpPressed){

        player.jumpBufferTimer=8;
        jumpPressed=false;

    }else{

        player.jumpBufferTimer--;
    }

    const left=
        keys.KeyA ||
        keys.ArrowLeft;

    const right=
        keys.KeyD ||
        keys.ArrowRight;

    if(left && !right){

        player.velocityX=
            Math.max(
                -player.maxSpeed,
                player.velocityX-player.acceleration
            );

        player.direction=-1;

    }else if(right && !left){

        player.velocityX=
            Math.min(
                player.maxSpeed,
                player.velocityX+player.acceleration
            );

        player.direction=1;

    }else{

        player.velocityX=0;
    }

    if(
        player.jumpBufferTimer>0 &&
        (
            player.grounded ||
            player.coyoteTimer>0
        )
    ){

        player.velocityY=
            -player.jumpPower;

        player.grounded=false;

        player.coyoteTimer=0;
        player.jumpBufferTimer=0;

        playSound(
            500,
            .12,
            "square",
            .05
        );
    }

    player.x+=player.velocityX;

    player.velocityY+=player.gravity;

    const jumpHeld=
        keys.Space ||
        keys.ArrowUp ||
        keys.KeyW;

    if(
        !jumpHeld &&
        player.velocityY<-5
    ){

        player.velocityY+=.35;
    }

    player.y+=player.velocityY;

    player.grounded=false;

    for(const p of level.platforms){

        const rightEdge=
            player.x+player.width;

        const playerBottom=
            player.y+player.height;

        const platformRight=
            p.x+p.w;

        const falling=
            player.velocityY>=0;

        const horizontal=
            rightEdge>p.x &&
            player.x<platformRight;

        const crossingTop=
            previousBottom<=p.y &&
            playerBottom>=p.y;

        if(
            falling &&
            horizontal &&
            crossingTop
        ){

            player.y=p.y-player.height;

            player.velocityY=0;
            player.grounded=true;
            player.jumpsLeft=1;
        }

        const hittingBottom=
            player.velocityY<0 &&
            previousY>=p.y+p.h &&
            player.y<=p.y+p.h;

        if(
            hittingBottom &&
            horizontal
        ){

            player.y=p.y+p.h;
            player.velocityY=0;
        }
    }

    for(const p of levelMovingPlatforms){

        const rightEdge=
            player.x+player.width;

        const playerBottom=
            player.y+player.height;

        const platformRight=
            p.x+p.w;

        const falling=
            player.velocityY>=0;

        const horizontal=
            rightEdge>p.x &&
            player.x<platformRight;

        const crossingTop=
            previousBottom<=p.y &&
            playerBottom>=p.y;

        if(
            falling &&
            horizontal &&
            crossingTop
        ){

            player.y=p.y-player.height;
            player.velocityY=0;
            player.grounded=true;
            player.jumpsLeft=1;
        }
    }

    player.x=clamp(
        player.x,
        0,
        level.width-player.width
    );

    if(player.y>canvas.height+80){

        loseLife();
        return;
    }


    /* COINS */

    for(const coin of levelCoins){

        if(coin.collected) continue;

        const box={
            x:coin.x-12,
            y:coin.y-12,
            width:24,
            height:24
        };

        if(rectsOverlap(player,box)){

            coin.collected=true;

            coins++;
            score+=100;

            playSound(
                850,
                .08,
                "square",
                .04
            );
        }
    }


    /* SPIKES */

    for(const spike of levelSpikes){

        const box={
            x:spike.x+5,
            y:spike.y+6,
            width:spike.w-10,
            height:spike.h-6
        };

        if(rectsOverlap(player,box)){

            hurtPlayer();
            return;
        }
    }


    /* ENEMIES */

    updateEnemies();


    for(const enemy of levelEnemies){

        if(!enemy.alive) continue;

        const box={
            x:enemy.x,
            y:enemy.y,
            width:enemy.w,
            height:enemy.h
        };

        if(rectsOverlap(player,box)){

            const stomp=
                player.velocityY>0 &&
                player.y+
                player.height-
                enemy.y<22;

            if(stomp){

                enemy.alive=false;

                player.velocityY=-9;

                score+=250;

                playSound(
                    220,
                    .12,
                    "square",
                    .05
                );

                createKeySparkles(
                    enemy.x+enemy.w/2,
                    enemy.y+10
                );

            }else{

                hurtPlayer();
                return;
            }
        }
    }


    /* PROJECTILES */

    for(
        let i=levelProjectiles.length-1;
        i>=0;
        i--
    ){

        const p=levelProjectiles[i];

        p.x+=p.velocityX;
        p.y+=p.velocityY;

        p.life--;

        if(
            p.life<=0 ||
            p.x<cameraX-100 ||
            p.x>cameraX+canvas.width+200
        ){

            levelProjectiles.splice(i,1);
            continue;
        }

        const box={
            x:p.x-8,
            y:p.y-8,
            width:16,
            height:16
        };

        if(rectsOverlap(player,box)){

            levelProjectiles.splice(i,1);

            hurtPlayer();
            return;
        }
    }


    /* BOSS */

    updateBoss();

    if(
        boss &&
        boss.health>0
    ){

        if(rectsOverlap(player,boss)){

            const stomp=
                player.velocityY>0 &&
                player.y+
                player.height-
                boss.y<30;

            if(stomp){

                boss.health--;

                boss.hitFlash=8;

                player.velocityY=-11;

                score+=500;

                playSound(
                    180,
                    .2,
                    "sawtooth",
                    .07
                );

                if(boss.health<=0){

                    score+=5000;

                    createConfetti(150);

                    playSound(
                        100,
                        .7,
                        "sawtooth",
                        .08
                    );
                }

            }else{

                hurtPlayer();
                return;
            }
        }
    }


    /* LEVEL 2 SECRET */

    if(currentLevel===1){

        updateLevel2Secret(
            level,
            previousY
        );
    }


    /* GOAL */

    const goal=level.goal;

    const goalBox={
        x:goal.x,
        y:goal.y,
        width:40,
        height:80
    };

    if(
        rectsOverlap(player,goalBox) &&
        (
            !boss ||
            boss.health<=0
        )
    ){

        completeLevel();
    }


    if(
        Math.abs(player.velocityX)>.1 &&
        player.grounded
    ){

        player.walkAnimation+=.2;

    }else{

        player.walkAnimation=0;
    }

    if(player.invincible>0){
        player.invincible--;
    }
}


/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(){

    for(const enemy of levelEnemies){

        if(!enemy.alive) continue;

        enemy.animation+=.08;

        if(enemy.type==="walker"){

            enemy.x+=
                enemy.speed*
                enemy.direction;

            if(
                Math.abs(
                    enemy.x-enemy.startX
                )>90
            ){

                enemy.direction*=-1;
            }
        }


        else if(enemy.type==="fast"){

            enemy.x+=
                enemy.speed*
                enemy.direction;

            if(
                Math.abs(
                    enemy.x-enemy.startX
                )>120
            ){

                enemy.direction*=-1;
            }
        }


        else if(enemy.type==="jumper"){

            enemy.x+=
                enemy.speed*
                enemy.direction;

            if(
                Math.abs(
                    enemy.x-enemy.startX
                )>100
            ){

                enemy.direction*=-1;
            }

            enemy.jumpTimer--;

            if(enemy.jumpTimer<=0){

                enemy.y=390;

                enemy.jumpTimer=
                    80+
                    Math.random()*80;

            }else{

                if(enemy.y>400){

                    enemy.y-=3;
                }else{

                    enemy.y+=3;
                }
            }
        }


        else if(enemy.type==="flyer"){

            enemy.x+=
                enemy.speed*
                enemy.direction;

            enemy.y=
                enemy.startY+
                Math.sin(
                    Date.now()*.004+
                    enemy.animation
                )*55;

            if(
                Math.abs(
                    enemy.x-enemy.startX
                )>130
            ){

                enemy.direction*=-1;
            }
        }
    }
}


/* =========================================================
   BOSS UPDATE
========================================================= */

function updateBoss(){

    if(!boss || boss.health<=0){
        return;
    }

    boss.hitFlash--;

    boss.x+=
        boss.speed*
        boss.direction;

    const minX=
        Math.max(
            6000,
            levels[currentLevel].width-850
        );

    const maxX=
        levels[currentLevel].width-300;

    if(
        boss.x<minX ||
        boss.x>maxX
    ){

        boss.direction*=-1;
    }

    boss.attackTimer--;

    if(boss.attackTimer<=0){

        boss.attackTimer=
            currentLevel===9
            ? 55
            : 75;

        boss.phase++;

        const shots=
            currentLevel===9
            ? 3
            : 2;

        for(let i=0;i<shots;i++){

            levelProjectiles.push({

                x:boss.x+
                    boss.width/2,

                y:boss.y+
                    boss.height/2,

                velocityX:
                    -5-
                    Math.random()*2,

                velocityY:
                    (i-((shots-1)/2))*1.7,

                life:180,

                type:"fire"
            });
        }

        playSound(
            90,
            .12,
            "sawtooth",
            .04
        );
    }
}


/* =========================================================
   LEVEL 2 SECRET
========================================================= */

function updateLevel2Secret(
    level,
    previousY
){

    const block=level.secretBlock;
    const key=level.secretKey;
    const door=level.secretDoor;

    const horizontal=
        player.x+player.width>block.x &&
        player.x<block.x+block.width;

    const underside=
        player.velocityY<0 &&
        previousY>=block.y+block.height &&
        player.y<=block.y+block.height;

    if(
        !block.activated &&
        horizontal &&
        underside
    ){

        block.activated=true;

        key.visible=true;

        key.x=block.x+21;
        key.y=block.y-28;

        key.velocityY=-3;

        score+=300;

        playSound(
            700,
            .12,
            "square",
            .05
        );

        createKeySparkles(
            key.x,
            key.y
        );
    }


    if(
        key.visible &&
        !key.collected
    ){

        if(key.y<420){

            key.velocityY+=.25;
            key.y+=key.velocityY;
        }

        const keyBox={
            x:key.x-15,
            y:key.y-18,
            width:50,
            height:55
        };

        if(rectsOverlap(player,keyBox)){

            key.collected=true;

            score+=500;

            keyPickupTimer=150;

            createKeySparkles(
                key.x,
                key.y
            );

            playSound(
                1000,
                .15,
                "square",
                .05
            );

            playSound(
                1300,
                .12,
                "sine",
                .04
            );
        }
    }


    const nearDoor=
        rectsOverlap(
            player,
            {
                x:door.x-35,
                y:door.y-10,
                width:door.width+70,
                height:door.height+20
            }
        );

    if(
        !door.opened &&
        key.collected &&
        nearDoor
    ){

        if(interactPressed){

            door.opened=true;

            interactPressed=false;

            playSound(
                650,
                .25,
                "square",
                .06
            );
        }
    }

    else if(
        door.opened &&
        nearDoor &&
        interactPressed
    ){

        interactPressed=false;

        enterSecretRoom();

        return;
    }
}


/* =========================================================
   DAMAGE
========================================================= */

function hurtPlayer(){

    if(player.invincible>0){
        return;
    }

    lives--;

    playSound(
        120,
        .25,
        "sawtooth",
        .06
    );

    player.invincible=100;

    livesElement.textContent=lives;

    if(lives<=0){

        gameOver();
        return;
    }

    const level=levels[currentLevel];

    player.x=level.spawn.x;
    player.y=level.spawn.y;

    player.velocityX=0;
    player.velocityY=0;
}

function loseLife(){

    lives--;

    livesElement.textContent=lives;

    playSound(
        100,
        .35,
        "sawtooth",
        .07
    );

    for(let i=0;i<20;i++){

        confetti.push({

            x:
                player.x-
                cameraX+
                player.width/2,

            y:player.y,

            velocityX:
                (Math.random()-.5)*6,

            velocityY:
                -Math.random()*5,

            gravity:.18,

            size:
                2+
                Math.random()*3,

            rotation:0,
            rotationSpeed:0,

            life:35,

            color:
                Math.random()>.5
                ? "#ff6600"
                : "#ffcc00"
        });
    }

    if(lives<=0){

        gameOver();
        return;
    }

    const level=levels[currentLevel];

    player.x=level.spawn.x;
    player.y=level.spawn.y;

    player.velocityX=0;
    player.velocityY=0;

    player.invincible=100;
}


/* =========================================================
   LAVA
========================================================= */

function drawLava(){

    const level=levels[currentLevel];

    const lavaTop=470;

    const ground=
        level.platforms
        .filter(
            p =>
                p.y===lavaTop &&
                p.h>=50
        )
        .sort(
            (a,b)=>a.x-b.x
        );

    let end=0;

    for(const p of ground){

        if(p.x>end){

            drawLavaHole(
                end,
                p.x
            );
        }

        end=p.x+p.w;
    }

    if(level.width>end){

        drawLavaHole(
            end,
            level.width
        );
    }
}

function drawLavaHole(
    worldStart,
    worldEnd
){

    const s=worldStart-cameraX;
    const e=worldEnd-cameraX;

    if(
        e<0 ||
        s>canvas.width
    ){
        return;
    }

    const vs=Math.max(0,s);
    const ve=Math.min(canvas.width,e);
    const w=ve-vs;

    const gradient=
        ctx.createLinearGradient(
            0,
            470,
            0,
            canvas.height
        );

    gradient.addColorStop(0,"#ff6500");
    gradient.addColorStop(.2,"#e52d00");
    gradient.addColorStop(.65,"#850b00");
    gradient.addColorStop(1,"#220000");

    ctx.fillStyle=gradient;

    ctx.fillRect(
        vs,
        470,
        w,
        canvas.height-470
    );

    const time=Date.now()*.003;

    ctx.beginPath();

    ctx.moveTo(vs,470);

    for(
        let x=vs-20;
        x<=ve+20;
        x+=15
    ){

        const wave=
            Math.sin(x*.035+time)*4+
            Math.sin(x*.015-time*1.4)*3;

        ctx.lineTo(
            x,
            470+wave
        );
    }

    ctx.lineTo(ve,500);
    ctx.lineTo(vs,500);

    ctx.closePath();

    ctx.fillStyle="#ff4800";
    ctx.fill();

    for(
        let x=vs;
        x<ve;
        x+=45
    ){

        const wave=
            Math.sin(x*.035+time)*4;

        ctx.fillStyle="#ffb000";

        ctx.beginPath();

        ctx.ellipse(
            x+10,
            472+wave,
            12,
            3,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

   BACKGROUND
========================================================= */

function drawBackground(){

    const level=levels[currentLevel];

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    switch(level.theme){

        case "green":

            gradient.addColorStop(0,"#70c5ff");
            gradient.addColorStop(1,"#d6f5ff");

            break;

        case "crystal":

            gradient.addColorStop(0,"#151c3b");
            gradient.addColorStop(1,"#36245e");

            break;

        case "dark":

            gradient.addColorStop(0,"#100f1c");
            gradient.addColorStop(1,"#241529");

            break;

        case "desert":

            gradient.addColorStop(0,"#f2b66d");
            gradient.addColorStop(1,"#7d3f32");

            break;

        case "fire":

            gradient.addColorStop(0,"#250707");
            gradient.addColorStop(1,"#8a1f0a");

            break;

        case "ice":

            gradient.addColorStop(0,"#8ed8ff");
            gradient.addColorStop(1,"#d9f7ff");

            break;

        case "city":

            gradient.addColorStop(0,"#20243a");
            gradient.addColorStop(1,"#080a13");

            break;

        case "volcano":

            gradient.addColorStop(0,"#170607");
            gradient.addColorStop(1,"#5e160b");

            break;

        case "shadow":

            gradient.addColorStop(0,"#05050d");
            gradient.addColorStop(1,"#17112a");

            break;

        case "final":

            gradient.addColorStop(0,"#050008");
            gradient.addColorStop(.5,"#28001e");
            gradient.addColorStop(1,"#050008");

            break;
    }

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* STJÄRNOR / PARTICLES */

    if(
        level.theme==="dark" ||
        level.theme==="shadow" ||
        level.theme==="final"
    ){

        for(let i=0;i<70;i++){

            const x=
                ((i*173-currentLevel*90)-
                cameraX*.15)%canvas.width;

            const y=
                30+
                ((i*71)%300);

            ctx.fillStyle=
                i%3===0
                ? "#ffd700"
                : "#aaa";

            ctx.fillRect(
                (x+canvas.width)%canvas.width,
                y,
                2,
                2
            );
        }
    }


    /* BERG / SILHUETTER */

    let backColor="#477047";

    if(
        level.theme==="desert"
    ){
        backColor="#a85d3a";
    }

    if(
        level.theme==="ice"
    ){
        backColor="#72a9ba";
    }

    if(
        level.theme==="city"
    ){
        backColor="#15182a";
    }

    if(
        level.theme==="fire" ||
        level.theme==="volcano"
    ){
        backColor="#3b1111";
    }

    if(
        level.theme==="shadow" ||
        level.theme==="final"
    ){
        backColor="#120c1d";
    }

    ctx.fillStyle=backColor;

    for(
        let x=-500;
        x<level.width+500;
        x+=350
    ){

        const sx=x-cameraX*.3;

        ctx.beginPath();

        ctx.moveTo(sx,470);

        ctx.lineTo(
            sx+175,
            250
        );

        ctx.lineTo(
            sx+350,
            470
        );

        ctx.fill();
    }


    /* EXTRA VOLCANO GLOW */

    if(
        level.theme==="fire" ||
        level.theme==="volcano" ||
        level.theme==="final"
    ){

        ctx.fillStyle=
            "rgba(255,70,0,.12)";

        ctx.fillRect(
            0,
            400,
            canvas.width,
            70
        );
    }
}


/* =========================================================
   PLATFORMS
========================================================= */

function drawPlatforms(){

    const level=levels[currentLevel];

    for(const p of level.platforms){

        const x=p.x-cameraX;

        if(
            x+p.w<0 ||
            x>canvas.width
        ){
            continue;
        }

        let base="#272027";
        let top="#8a2525";

        if(level.theme==="green"){

            base="#4f3423";
            top="#3fa34d";

        }else if(level.theme==="ice"){

            base="#6b8290";
            top="#d7f8ff";

        }else if(level.theme==="desert"){

            base="#70452c";
            top="#d49a54";

        }else if(
            level.theme==="fire" ||
            level.theme==="volcano"
        ){

            base="#321717";
            top="#d93616";

        }else if(level.theme==="city"){

            base="#202532";
            top="#4d6177";

        }else if(level.theme==="final"){

            base="#171018";
            top="#8c163f";
        }

        ctx.fillStyle=base;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );

        ctx.fillStyle=top;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            8
        );

        ctx.fillStyle=
            level.theme==="ice"
            ? "#a9d7e8"
            : "#392c38";

        for(
            let i=0;
            i<p.w;
            i+=35
        ){

            ctx.fillRect(
                x+i+5,
                p.y+15,
                20,
                5
            );
        }
    }
}


/* =========================================================
   SPIKES
========================================================= */

function drawSpikes(){

    for(const s of levelSpikes){

        const x=s.x-cameraX;

        if(
            x+s.w<0 ||
            x>canvas.width
        ){
            continue;
        }

        ctx.fillStyle="#bfc3c8";

        const count=
            Math.max(
                1,
                Math.floor(s.w/15)
            );

        const step=s.w/count;

        for(let i=0;i<count;i++){

            ctx.beginPath();

            ctx.moveTo(
                x+i*step,
                s.y+s.h
            );

            ctx.lineTo(
                x+i*step+step/2,
                s.y
            );

            ctx.lineTo(
                x+(i+1)*step,
                s.y+s.h
            );

            ctx.closePath();

            ctx.fill();
        }

        ctx.fillStyle="#555";

        ctx.fillRect(
            x,
            s.y+s.h-3,
            s.w,
            3
        );
    }
}


/* =========================================================
   COINS
========================================================= */

function drawCoins(){

    for(const c of levelCoins){

        if(c.collected) continue;

        c.animation+=.08;

        const x=c.x-cameraX;

        const scale=
            .75+
            Math.abs(
                Math.sin(c.animation)
            )*.25;

        ctx.save();

        ctx.translate(x,c.y);

        ctx.scale(scale,1);

        ctx.fillStyle="#ffd700";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            12,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#ff9d00";
        ctx.lineWidth=3;
        ctx.stroke();

        ctx.fillStyle="#fff4a3";

        ctx.fillRect(
            -3,
            -7,
            4,
            8
        );

        ctx.restore();
    }
}


/* =========================================================
   ENEMIES
========================================================= */

function drawEnemies(){

    for(const e of levelEnemies){

        if(!e.alive) continue;

        const x=e.x-cameraX;
        const y=e.y;
        const w=e.w;
        const h=e.h;

        if(
            x+w<0 ||
            x>canvas.width
        ){
            continue;
        }


        if(e.type==="flyer"){

            ctx.fillStyle="#193b8f";

            ctx.beginPath();

            ctx.ellipse(
                x+w/2,
                y+h/2,
                w/2,
                h/2,
                0,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#6ec6ff";

            ctx.fillRect(
                x-8,
                y+12,
                12,
                15
            );

            ctx.fillRect(
                x+w-4,
                y+12,
                12,
                15
            );

        }else{

            let body="#7d24a8";

            if(e.type==="fast"){
                body="#b52b32";
            }

            if(e.type==="jumper"){
                body="#2f9e58";
            }

            ctx.fillStyle="rgba(0,0,0,.3)";

            ctx.fillRect(
                x+3,
                y+h-3,
                w,
                6
            );

            ctx.fillStyle=body;

            ctx.fillRect(
                x,
                y,
                w,
                h
            );

            ctx.fillStyle="#fff";

            ctx.fillRect(
                x+6,
                y+8,
                8,
                8
            );

            ctx.fillRect(
                x+w-14,
                y+8,
                8,
                8
            );

            ctx.fillStyle="#111";

            ctx.fillRect(
                x+9,
                y+10,
                4,
                5
            );

            ctx.fillRect(
                x+w-11,
                y+10,
                4,
                5
            );

            ctx.fillStyle="#23051f";

            ctx.fillRect(
                x+6,
                y+25,
                w-12,
                8
            );

            ctx.fillStyle="#fff";

            for(let i=0;i<3;i++){

                ctx.fillRect(
                    x+9+i*7,
                    y+25,
                    4,
                    6
                );
            }

            ctx.fillStyle="#3b104e";

            ctx.fillRect(
                x+3,
                y+h-6,
                10,
                7
            );

            ctx.fillRect(
                x+w-13,
                y+h-6,
                10,
                7
            );
        }
    }
}

/* =========================================================
   BOSS
========================================================= */

function drawBoss(){

    if(
        !boss ||
        boss.health<=0
    ){
        return;
    }

    const x=boss.x-cameraX;
    const y=boss.y;

    const finalBoss=
        currentLevel===9;

    ctx.save();

    if(boss.hitFlash>0){

        ctx.globalAlpha=
            .65+
            Math.sin(
                boss.hitFlash
            )*.2;
    }

    ctx.shadowColor=
        finalBoss
        ? "#ff00aa"
        : "#ff0000";

    ctx.shadowBlur=25;

    ctx.fillStyle=
        finalBoss
        ? "#26002f"
        : "#4d0a0a";

    ctx.fillRect(
        x,
        y,
        boss.width,
        boss.height
    );

    ctx.shadowBlur=0;


    /* HORN */

    ctx.fillStyle="#d8d8d8";

    ctx.beginPath();

    ctx.moveTo(
        x+20,
        y+15
    );

    ctx.lineTo(
        x,
        y-35
    );

    ctx.lineTo(
        x+40,
        y+10
    );

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x+boss.width-20,
        y+15
    );

    ctx.lineTo(
        x+boss.width,
        y-35
    );

    ctx.lineTo(
        x+boss.width-40,
        y+10
    );

    ctx.fill();


    /* EYES */

    ctx.fillStyle=
        finalBoss
        ? "#ff00ff"
        : "#ff2b00";

    ctx.fillRect(
        x+25,
        y+38,
        20,
        10
    );

    ctx.fillRect(
        x+boss.width-45,
        y+38,
        20,
        10
    );


    /* MOUTH */

    ctx.fillStyle="#000";

    ctx.fillRect(
        x+25,
        y+75,
        boss.width-50,
        30
    );

    ctx.fillStyle="#fff";

    const teeth=
        finalBoss
        ? 7
        : 5;

    for(let i=0;i<teeth;i++){

        ctx.fillRect(
            x+30+i*
                ((boss.width-60)/(teeth-1)),
            y+75,
            7,
            13
        );
    }


    /* HEALTH BAR */

    ctx.fillStyle="#111";

    ctx.fillRect(
        x,
        y-55,
        boss.width,
        12
    );

    ctx.fillStyle=
        finalBoss
        ? "#ff1493"
        : "#ff2222";

    ctx.fillRect(
        x,
        y-55,
        boss.width*
        (
            boss.health/
            boss.maxHealth
        ),
        12
    );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;

    ctx.strokeRect(
        x,
        y-55,
        boss.width,
        12
    );

    ctx.restore();


    ctx.save();

    ctx.textAlign="center";

    ctx.font="bold 18px Arial";

    ctx.fillStyle="#fff";

    ctx.shadowColor="#000";
    ctx.shadowBlur=5;

    ctx.fillText(
        finalBoss
        ? "FINAL BOSS"
        : "BOSS",
        x+boss.width/2,
        y-65
    );

    ctx.restore();
}


/* =========================================================
   GOAL
========================================================= */

function drawGoal(){

    const goal=
        levels[currentLevel].goal;

    const x=goal.x-cameraX;
    const y=goal.y;

    const celebrating=
        levelCompleteTimer>0;

    const wave=
        Math.sin(Date.now()*.008)*4;

    if(celebrating){

        ctx.shadowColor="#ffd700";
        ctx.shadowBlur=25;
    }

    ctx.fillStyle="#d5d5d5";

    ctx.fillRect(
        x+17,
        y,
        6,
        80
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#ffd700";

    ctx.beginPath();

    ctx.arc(
        x+20,
        y-3,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
        currentLevel===9
        ? "#ff1493"
        : "#fff";

    ctx.beginPath();

    ctx.moveTo(
        x+23,
        y+5
    );

    ctx.quadraticCurveTo(
        x+43,
        y+12+wave,
        x+63,
        y+20
    );

    ctx.quadraticCurveTo(
        x+43,
        y+28-wave,
        x+23,
        y+35
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   SECRET OBJECTS
========================================================= */

function drawSecretObjects(){

    if(currentLevel!==1){
        return;
    }

    const level=levels[currentLevel];

    const key=level.secretKey;
    const door=level.secretDoor;


    if(
        key.visible &&
        !key.collected
    ){

        const x=key.x-cameraX;
        const baseY=key.y;

        const float=
            Math.sin(Date.now()*.006)*5;

        const rotation=
            Math.sin(Date.now()*.004)*.12;

        const pulse=
            22+
            Math.sin(Date.now()*.01)*10;

        ctx.save();

        ctx.translate(
            x,
            baseY+float
        );

        ctx.rotate(rotation);

        ctx.shadowColor="#ffd700";
        ctx.shadowBlur=pulse;

        ctx.strokeStyle="#fff1a0";
        ctx.lineWidth=6;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            12,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.strokeStyle="#ffd700";
        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            7,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.fillStyle="#ffd700";

        ctx.fillRect(
            8,
            -3,
            30,
            7
        );

        ctx.fillRect(
            28,
            3,
            6,
            10
        );

        ctx.fillRect(
            36,
            3,
            6,
            10
        );

        ctx.fillStyle="#fffbd0";

        ctx.fillRect(
            9,
            -7,
            5,
            4
        );

        ctx.shadowBlur=0;

        ctx.fillStyle="#fff6a0";

        const sparkleSize=
            3+
            Math.sin(Date.now()*.012)*1;

        const positions=[
            [-23,-13],
            [23,-17],
            [-25,15],
            [28,14]
        ];

        for(const pos of positions){

            ctx.beginPath();

            ctx.arc(
                pos[0],
                pos[1],
                sparkleSize,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        ctx.restore();

        ctx.save();

        ctx.textAlign="center";
        ctx.font="bold 16px Arial";

        ctx.shadowColor="#000";
        ctx.shadowBlur=5;

        ctx.fillStyle="#ffd700";

        ctx.fillText(
            "🔑",
            x,
            baseY-30+float
        );

        ctx.restore();
    }


    /* DOOR */

    const dx=door.x-cameraX;

    ctx.fillStyle=
        door.opened
        ? "#251508"
        : "#111";

    ctx.fillRect(
        dx,
        door.y,
        door.width,
        door.height
    );

    ctx.strokeStyle="#8a6a3a";
    ctx.lineWidth=5;

    ctx.strokeRect(
        dx,
        door.y,
        door.width,
        door.height
    );

    ctx.fillStyle="#ffd700";

    ctx.beginPath();

    ctx.arc(
        dx+42,
        door.y+42,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.textAlign="center";
    ctx.font="bold 13px Arial";

    if(!door.opened){

        ctx.fillStyle="#ffcc00";

        ctx.fillText(
            "🔒",
            dx+27,
            door.y-10
        );

    }else if(
        level.secretKey.collected
    ){

        ctx.fillStyle="#ffd700";

        ctx.fillText(
            "E",
            dx+27,
            door.y-10
        );
    }
}


/* =========================================================

========================================================= */

function drawKeyPickupMessage(){

    if(keyPickupTimer<=0){
        return;
    }

    const progress=
        150-keyPickupTimer;

    const fadeIn=
        Math.min(
            1,
            progress/15
        );

    const fadeOut=
        Math.min(
            1,
            keyPickupTimer/25
        );

    const alpha=
        Math.min(
            fadeIn,
            fadeOut
        );

    const scale=
        1+

    ctx.globalAlpha=alpha;

    ctx.translate(
        canvas.width/2,

    ctx.scale(scale,scale);

    ctx.fillStyle="rgba(0,0,0,.65)";

        65,
        12

    ctx.fill();

    ctx.shadowColor="#ffd700";
    ctx.shadowBlur=25;

    ctx.textAlign="center";

    ctx.fillStyle="#ffd700";

    ctx.fillText(
        "🔑 NYCKEL!",
        0,
        5
    );

    ctx.shadowBlur=0;

    ctx.font="bold 16px Arial";

    ctx.fillStyle="#fff";

    ctx.fillText(
        "+500 poäng",
        0,
        27
    );

    ctx.restore();
}

/* =========================================================
   SECRET ROOM
========================================================= */

function enterSecretRoom(){

    if(secretRoomActive){
        return;
    }

    secretRoomActive=true;
    gameRunning=false;

    levels[currentLevel]
        .secretRoom.active=true;

    player.x=220;
    player.y=350;

    player.velocityX=0;
    player.velocityY=0;

    cameraX=0;

    playSound(
        500,
        .2,
        "square",
        .05
    );
}

function exitSecretRoom(){

    secretRoomActive=false;
    gameRunning=true;

    levels[currentLevel]
        .secretRoom.active=false;

    const door=
        levels[currentLevel].secretDoor;

    player.x=
        door.x+
        door.width+
        15;

    player.y=390;

    player.velocityX=0;
    player.velocityY=0;

    cameraX=
        clamp(
            player.x-
            canvas.width*.4,
            0,
            levels[currentLevel].width-
            canvas.width
        );

    playSound(
        350,
        .15,
        "square",
        .05
    );
}


/* =========================================================
   SECRET ROOM UPDATE
========================================================= */

function updateSecretRoomPlayer(){

    const left=
        keys.KeyA ||
        keys.ArrowLeft;

    const right=
        keys.KeyD ||
        keys.ArrowRight;

    if(left && !right){

        player.x-=4;
        player.direction=-1;

    }else if(right && !left){

        player.x+=4;
        player.direction=1;
    }

    player.x=
        clamp(
            player.x,
            110,
            850
        );

    player.y=350;

    const level=
        levels[currentLevel];

    if(interactPressed){

        interactPressed=false;

        if(player.x<220){

            exitSecretRoom();
            return;
        }

        if(
            !level.secretRoom.chestOpened &&
            player.x>385 &&
            player.x<590
        ){

            openSecretChest();
            return;
        }
    }
}


/* =========================================================
   CHEST
========================================================= */

function openSecretChest(){

    const level=
        levels[currentLevel];

    if(level.secretRoom.chestOpened){
        return;
    }

    level.secretRoom.chestOpened=true;

    score+=2000;

    createConfetti(120);

    playSound(
        900,
        .15,
        "square",
        .06
    );

    setTimeout(()=>{

        level.secretRoom.medalCollected=true;

        score+=5000;

        createConfetti(180);

        playSound(
            1200,
            .25,
            "sine",
            .07
        );

    },800);
}


/* =========================================================
   SECRET ROOM DRAW
========================================================= */

function drawSecretRoom(){

    const level=
        levels[currentLevel];

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#080812"
    );

    gradient.addColorStop(
        1,
        "#25102d"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#30203a";

    ctx.fillRect(
        80,
        80,
        840,
        400
    );

    ctx.fillStyle="#17131b";

    ctx.fillRect(
        80,
        420,
        840,
        60
    );

    ctx.fillRect(
        80,
        80,
        840,
        35
    );

    ctx.fillStyle="#5b3970";

    ctx.fillRect(
        130,
        150,
        12,
        180
    );

    ctx.fillRect(
        850,
        150,
        12,
        180
    );

    ctx.textAlign="center";

    ctx.fillStyle="#ffd700";

    ctx.font="bold 32px Arial";

    ctx.fillText(
        "HEMLIGA RUMMET",
        500,
        155
    );

    ctx.font="18px Arial";

    ctx.fillStyle="#aaa";

    ctx.fillText(
        "Du hittade den gömda skatten...",
        500,
        185
    );

    const chestX=430;
    const chestY=330;

    ctx.fillStyle="rgba(0,0,0,.4)";

    ctx.fillRect(
        chestX+5,
        chestY+55,
        140,
        15
    );

    ctx.fillStyle="#8b4a20";

    ctx.fillRect(
        chestX,
        chestY,
        140,
        60
    );

    if(!level.secretRoom.chestOpened){

        ctx.fillStyle="#a8662b";

        ctx.fillRect(
            chestX,
            chestY-20,
            140,
            25
        );

        ctx.fillStyle="#d39b35";

        ctx.fillRect(
            chestX+8,
            chestY+5,
            8,
            50
        );

        ctx.fillRect(
            chestX+124,
            chestY+5,
            8,
            50
        );

        ctx.fillStyle="#ffd700";

        ctx.fillRect(
            chestX+62,
            chestY+12,
            16,
            20
        );

    }else{

        ctx.fillStyle="#a8662b";

        ctx.fillRect(
            chestX,
            chestY-55,
            140,
            25
        );

        ctx.shadowColor="#ffd700";
        ctx.shadowBlur=25;

        ctx.fillStyle="#ffd700";

        ctx.beginPath();

        ctx.arc(
            chestX+70,
            chestY-5,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.beginPath();

        ctx.arc(
            chestX+70,
            chestY-5,
            20,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#fff2a8";
        ctx.lineWidth=4;
        ctx.stroke();

        ctx.fillStyle="#8a5a00";
        ctx.font="bold 18px Arial";

        ctx.fillText(
            "★",
            chestX+70,
            chestY+2
        );
    }

    ctx.fillStyle="#fff";
    ctx.font="16px Arial";

    if(!level.secretRoom.chestOpened){

        ctx.fillText(
            "Gå fram till kistan och tryck E",
            500,
            520
        );

    }else if(
        !level.secretRoom.medalCollected
    ){

        ctx.fillText(
            "🥇 Guldmedaljen är din!",
            500,
            520
        );

    }else{

        ctx.fillText(
            "🥇 Guldmedalj erhållen! +5000 poäng",
            500,
            520
        );
    }

    ctx.fillStyle="#555";

    ctx.fillRect(
        120,
        365,
        70,
        55
    );

    ctx.fillStyle="#ddd";

    ctx.font="14px Arial";

    ctx.fillText(
        "UT",
        155,
        397
    );

    if(player.x<230){

        ctx.fillStyle="#ffd700";
        ctx.font="bold 14px Arial";

        ctx.fillText(
            "E = Gå ut",
            190,
            345
        );
    }

    drawSecretRoomPlayer();
}


/* =========================================================
   SECRET ROOM PLAYER DRAW
========================================================= */

function drawSecretRoomPlayer(){

    const x=player.x;
    const y=player.y;

    ctx.save();

    ctx.translate(x,y);

    ctx.fillStyle="#e53935";

    ctx.fillRect(
        5,
        15,
        24,
        28
    );

    ctx.fillStyle="#f2b27a";

    ctx.fillRect(
        7,
        0,
        20,
        20
    );

    ctx.fillStyle="#4a2415";

    ctx.fillRect(
        6,
        0,
        22,
        7
    );

    ctx.fillStyle="#e53935";

    ctx.fillRect(
        4,
        -4,
        25,
        7
    );

    ctx.fillStyle="#111";

    if(player.direction===1){

        ctx.fillRect(
            22,
            8,
            3,
            3
        );

    }else{

        ctx.fillRect(
            9,
            8,
            3,
            3
        );
    }

    ctx.fillStyle="#f2b27a";

    ctx.fillRect(
        0,
        18,
        7,
        17
    );

    ctx.fillRect(
        27,
        18,
        7,
        17
    );

    ctx.fillStyle="#2455a4";

    ctx.fillRect(
        7,
        40,
        9,
        8
    );

    ctx.fillRect(
        18,
        40,
        9,
        8
    );

    ctx.restore();
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(secretRoomActive){
        return;
    }

    const target=
        player.x-
        canvas.width*.4;

    cameraX+=
        (
            target-cameraX
        )*.1;

    cameraX=
        clamp(
            cameraX,
            0,
            levels[currentLevel].width-
            canvas.width
        );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    coinsElement.textContent=coins;
    livesElement.textContent=lives;
    scoreElement.textContent=score;

    if(currentLevel===1){

        const key=
            levels[currentLevel].secretKey;

        if(key.collected){

            keyStatusElement.textContent="JA";
            keyStatusElement.style.color="#ffd700";

        }else{

            keyStatusElement.textContent="NEJ";
            keyStatusElement.style.color="#aaa";
        }

    }else{

        keyStatusElement.textContent="—";
        keyStatusElement.style.color="#aaa";
    }
}


/* =========================================================
   COMPLETE LEVEL
========================================================= */

function completeLevel(){

    if(levelTransition>0){
        return;
    }

    levelTransition=100;
    levelCompleteTimer=110;

    player.velocityX=0;
    player.velocityY=0;

    score+=1000;

    createConfetti(
        currentLevel===levels.length-1
        ? 300
        : 150
    );

    playSound(
        700,
        .15,
        "square",
        .06
    );

    setTimeout(()=>{

        if(
            currentLevel<
            levels.length-1
        ){

            levelCompleteTimer=0;

            loadLevel(
                currentLevel+1
            );

        }else{

            levelCompleteTimer=0;

            winGame();
        }

        levelTransition=0;

    },2300);
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    gameRunning=false;

    messageTitle.textContent="GAME OVER";

    messageText.textContent=
        "Du nådde bana "+
        (currentLevel+1)+
        "! Poäng: "+
        score;

    message.style.display="flex";
}


/* =========================================================
   WIN
========================================================= */

function winGame(){

    gameRunning=false;

    createConfetti(350);

    messageTitle.textContent=
        "DU KLARADE ALLA 10 BANOR! 🎉";

    messageText.textContent=
        "Du besegrade båda bossarna! Poäng: "+
        score;

    message.style.display="flex";
}


/* =========================================================
   MESSAGE
========================================================= */

function hideMessage(){

    message.style.display="none";
}


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    coins=0;
    lives=3;
    score=0;

    gameRunning=true;

    levelTransition=0;
    levelCompleteTimer=0;

    keyPickupTimer=0;

    secretRoomActive=false;

    confetti.length=0;

    updateHUD();

    loadLevel(0);
}

restartButton.addEventListener(
    "click",
    ()=>{
        initAudio();
        restartGame();
    }
);


/* =========================================================
   DRAW
========================================================= */

function draw(){

    if(secretRoomActive){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        drawSecretRoom();

        drawConfetti();

        return;
    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawLava();

    drawPlatforms();

    drawMovingPlatforms();

    drawSpikes();

    drawCoins();

    drawEnemies();

    drawProjectiles();

    drawBoss();

    drawSecretObjects();

    drawGoal();

    drawPlayer();

    drawConfetti();

    drawKeyPickupMessage();


    if(levelCompleteTimer>0){

        const alpha=
            Math.min(
                1,
                (
                    110-
                    levelCompleteTimer
                )/20
            );

        ctx.save();

        ctx.globalAlpha=alpha;

        ctx.textAlign="center";

        ctx.font="bold 46px Arial";

        ctx.fillStyle="#fff";

        ctx.shadowColor="#000";
        ctx.shadowBlur=8;

        ctx.fillText(
            currentLevel===levels.length-1
            ? "DU KLARADE DET!"
            : "BANA KLAR!",
            canvas.width/2,
            150
        );

        ctx.font="bold 22px Arial";

        ctx.fillStyle="#ffd700";

        ctx.fillText(
            currentLevel===levels.length-1
            ? "🎉 FANTASTISKT! 🎉"
            : "Nästa bana kommer...",
            canvas.width/2,
            190
        );

        ctx.restore();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

    updatePlayer();

    updateMovingPlatforms();

    updateCamera();

    updateConfetti();

    if(keyPickupTimer>0){
        keyPickupTimer--;
    }

    updateHUD();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START
========================================================= */

loadLevel(0);

updateHUD();

gameLoop();

</script>
